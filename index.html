<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>未來素養教學輔助工具｜未來輪</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="favicon.svg" />
  <link rel="stylesheet" href="vendor/vis-network.min.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; overflow: hidden; font-family: "Arial Unicode MS", Arial, sans-serif; }
    body { display: flex; flex-direction: column; background: #f8fafc; color: #1e293b; }
    .app-body { flex: 1; display: flex; flex-direction: row; min-height: 0; }
    .sidebar {
      flex-shrink: 0;
      width: 272px;
      height: 100%;
      display: flex;
      flex-direction: column;
      border-right: 1px solid #e2e8f0;
      background: #fff;
      box-shadow: 1px 0 2px rgb(0 0 0 / 0.04);
      overflow-y: auto;
      overflow-x: hidden;
    }
    .sidebar-top { padding: 0.75rem 0.75rem 0; display: flex; flex-direction: column; gap: 0.5rem; }
    .data-io { display: flex; flex-direction: row; gap: 0.375rem; }
    .data-io button { flex: 1; width: auto; }
    .data-io button.tool-icon-btn { flex: 1; min-width: 0; }
    .data-io .tool-icon { width: 18px; height: 18px; }
    .sidebar-actions { display: flex; flex-direction: column; gap: 0.375rem; padding-bottom: 0.5rem; border-bottom: 1px solid #f1f5f9; }
    .sidebar-stroke-settings { display: flex; flex-direction: column; gap: 0.375rem; padding-top: 0.125rem; }
    .panel, .toolbar { display: flex; flex-direction: column; align-items: stretch; gap: 0.5rem; padding: 0.75rem; }
    .toolbar { padding-top: 0; flex: 1; }
    .title-row { display: flex; align-items: center; justify-content: space-between; gap: 0.5rem; }
    h1 { margin: 0; font-size: 1.125rem; font-weight: 600; color: #334155; white-space: nowrap; }
    label.field { display: flex; flex-direction: column; gap: 0.125rem; min-width: 0; }
    label.field span { font-size: 0.75rem; color: #64748b; }
    input:not(.node-size-input), select { font-size: 0.875rem; border: 1px solid #e2e8f0; border-radius: 0.375rem; padding: 0.375rem 0.5rem; width: 100%; }
    select { width: auto; font-size: 0.75rem; padding: 0.125rem 0.25rem; }
    label.field select { width: 100%; font-size: 0.875rem; padding: 0.375rem 0.5rem; }
    button { font-size: 0.75rem; border: 1px solid #e2e8f0; border-radius: 0.375rem; background: #fff; padding: 0.375rem 0.5rem; cursor: pointer; width: 100%; }
    button:hover { background: #f8fafc; }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    button:disabled:hover { background: #fff; }
    .btn-primary {
      background: linear-gradient(180deg, #3730a3 0%, #312e81 100%);
      color: #fff;
      border-color: #4338ca;
      box-shadow: 0 1px 2px rgb(49 46 129 / 0.2);
      font-weight: 600;
    }
    .btn-primary:hover { background: linear-gradient(180deg, #4338ca 0%, #3730a3 100%); }
    .btn-new-wheel {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      width: 100%;
      min-height: 2.625rem;
      padding: 0.6875rem 0.875rem;
      font-size: 1rem;
    }
    .btn-new-wheel .btn-new-icon {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
      pointer-events: none;
    }
    #status { font-size: 0.75rem; color: #047857; min-height: 1rem; padding: 0 0.75rem 0.5rem; margin: 0; }
    .btn-danger { color: #dc2626; border-color: #fecaca; }
    .btn-danger:hover { background: #fef2f2; }
    .sidebar-section { display: flex; flex-direction: column; gap: 0.375rem; }
    .sidebar-divider { border: none; border-top: 1px solid #e2e8f0; margin: 0.5rem 0 0.25rem; }
    .sidebar-label { margin: 0; font-size: 1.125rem; font-weight: 600; color: #1e293b; padding-top: 0.25rem; }
    .sep { display: none; }
    .hints { font-size: 0.75rem; color: #64748b; line-height: 1.5; padding: 0.5rem 0.75rem 0.375rem; margin: 0; border-top: 1px solid #f1f5f9; }
    .app-credit {
      font-size: 0.75rem;
      font-weight: 600;
      color: #dc2626;
      line-height: 1.45;
      padding: 0 0.75rem 0.75rem;
      margin: 0;
      text-align: center;
    }
    .app-header {
      flex-shrink: 0;
      padding: 1.5rem 2rem 1.25rem;
      background: #fff;
      border-bottom: 1px solid #e2e8f0;
    }
    .app-title-wrap { display: flex; flex-direction: column; gap: 0.25rem; }
    .app-title {
      margin: 0;
      font-size: 2.5rem;
      font-weight: 700;
      font-style: normal;
      color: #1e293b;
      line-height: 1.2;
      letter-spacing: 0.01em;
    }
    .app-subtitle {
      margin: 0;
      padding-left: 1.75rem;
      font-size: 1.5rem;
      font-weight: 700;
      font-style: italic;
      color: #64748b;
      line-height: 1.3;
      letter-spacing: 0.01em;
    }
    main { flex: 1; position: relative; min-width: 0; min-height: 0; }
    .canvas-wrap { width: 100%; height: 100%; position: relative; }
    #network { width: 100%; height: 100%; touch-action: none; background: #f8fafc; }
    #selection-box {
      display: none;
      position: absolute;
      border: 2px solid #dc2626;
      background: rgba(220, 38, 38, 0.05);
      pointer-events: none;
      z-index: 10;
    }
    #ctx-menu { display: none; position: fixed; z-index: 9999; min-width: 168px; background: #fff; border: 1px solid #e2e8f0; border-radius: 0.375rem; box-shadow: 0 4px 12px rgb(0 0 0 / 0.1); padding: 0.25rem 0; font-size: 0.875rem; }
    #ctx-menu.show { display: block; }
    #ctx-menu button { display: flex; align-items: center; width: 100%; text-align: left; border: none; border-radius: 0; padding: 0.375rem 0.75rem; }
    #ctx-menu button:hover { background: #f1f5f9; }
    #ctx-menu button.danger { color: #dc2626; }
    #ctx-menu button.active-style { background: #eef2ff; color: #3730a3; font-weight: 600; }
    #ctx-menu .ctx-menu-item { display: inline-flex; align-items: center; gap: 0.5rem; white-space: nowrap; }
    #ctx-menu .ctx-menu-mark {
      width: 24px;
      flex-shrink: 0;
      text-align: center;
      font-size: 0.8125rem;
      font-weight: 700;
      line-height: 1;
      color: #3730a3;
      opacity: 0;
    }
    #ctx-menu button.active-style .ctx-menu-mark { opacity: 1; }
    #ctx-menu .ctx-menu-preview {
      width: 24px;
      height: 14px;
      flex-shrink: 0;
      color: #0f172a;
    }
    #ctx-menu button.active-style .ctx-menu-preview { color: #3730a3; }
    #ctx-menu .ctx-sep { height: 1px; background: #e2e8f0; margin: 0.25rem 0; }
    .ctx-submenu-wrap { position: relative; }
    .ctx-submenu-wrap.hidden { display: none; }
    .ctx-submenu-trigger {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      text-align: left;
      border: none;
      border-radius: 0;
      padding: 0.375rem 0.75rem;
      background: transparent;
      font: inherit;
      color: inherit;
      cursor: default;
    }
    .ctx-submenu-wrap:hover > .ctx-submenu-trigger,
    .ctx-submenu-wrap:focus-within > .ctx-submenu-trigger { background: #f1f5f9; }
    .ctx-submenu-chevron { margin-left: 0.5rem; color: #64748b; font-size: 0.75rem; line-height: 1; }
    .ctx-submenu {
      display: none;
      position: absolute;
      left: 100%;
      top: 0;
      min-width: 148px;
      margin-left: -2px;
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 0.375rem;
      box-shadow: 0 4px 12px rgb(0 0 0 / 0.1);
      padding: 0.25rem 0;
      z-index: 1;
    }
    .ctx-submenu-wrap:hover > .ctx-submenu,
    .ctx-submenu-wrap:focus-within > .ctx-submenu { display: block; }
    .ctx-submenu.flip-left { left: auto; right: 100%; margin-left: 0; margin-right: -2px; }
    .toolbar-btn.active { box-shadow: 0 0 0 2px #818cf8; background: #eef2ff; }
    .color-bar { display: flex; flex-direction: column; gap: 0.375rem; }
    .color-pick { display: flex; align-items: center; gap: 0.5rem; font-size: 0.75rem; color: #64748b; }
    .color-pick > span:first-child { flex: 1; min-width: 0; }
    .color-pick-controls { display: flex; align-items: center; gap: 0.375rem; flex-shrink: 0; margin-left: auto; }
    .color-pick input[type="color"] { width: 28px; height: 24px; padding: 2px; border: 1px solid #e2e8f0; border-radius: 0.25rem; cursor: pointer; background: #fff; flex-shrink: 0; }
    .color-pick input[type="color"]:disabled {
      opacity: 0;
      width: 0;
      min-width: 0;
      padding: 0;
      border: 0;
      margin: 0;
      pointer-events: none;
    }
    .node-size-input {
      width: 2rem;
      min-width: 2rem;
      max-width: 2rem;
      flex: 0 0 2rem;
      padding: 0.125rem 0.125rem;
      font-size: 0.75rem;
      text-align: center;
      box-sizing: border-box;
    }
    .node-count-display {
      width: 2rem;
      min-width: 2rem;
      max-width: 2rem;
      flex: 0 0 2rem;
      padding: 0.125rem 0.125rem;
      font-size: 0.75rem;
      text-align: center;
      box-sizing: border-box;
      color: #64748b;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 0.25rem;
      line-height: 1.35;
      user-select: none;
    }
    .hidden { display: none !important; }
    #load-error { display: none; margin: 0.75rem 0.75rem 0; padding: 0.75rem; background: #fef2f2; border: 1px solid #fecaca; border-radius: 0.5rem; color: #991b1b; font-size: 0.8125rem; }
    #load-error.show { display: block; }
    .text-option {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.75rem;
      color: #64748b;
      cursor: pointer;
      user-select: none;
      padding-top: 0.125rem;
    }
    .text-option input[type="checkbox"] {
      width: auto;
      margin: 0;
      cursor: pointer;
      flex-shrink: 0;
    }
    .text-translate-row {
      display: flex;
      flex-direction: row;
      align-items: flex-end;
      gap: 0.375rem;
      padding-top: 0.375rem;
    }
    .text-translate-langs { display: flex; flex-direction: row; gap: 0.375rem; flex: 1; min-width: 0; }
    .text-translate-langs .text-translate-field { flex: 1; min-width: 0; }
    .text-translate-field span { font-size: 0.75rem; color: #64748b; }
    .text-translate-field select { font-size: 0.75rem; padding: 0.25rem 0.375rem; }
    .text-translate-btn {
      flex: 0 0 2rem;
      width: 2rem;
      min-width: 2rem;
      padding: 0.25rem 0;
      text-align: center;
      align-self: flex-end;
    }
    .tools-row { display: flex; flex-direction: row; gap: 0.375rem; }
    .tools-row > button,
    .tools-row > .tool-dropdown { flex: 1; min-width: 0; }
    .tool-icon-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0.375rem 0.25rem;
      min-height: 2rem;
    }
    .tool-icon { width: 16px; height: 16px; flex-shrink: 0; color: #475569; pointer-events: none; }
    .tool-icon-btn.active .tool-icon { color: #3730a3; }
    .tool-dropdown { position: relative; }
    .tool-dropdown-trigger {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.125rem;
      width: 100%;
    }
    .tool-dropdown-chevron {
      width: 7px;
      height: 7px;
      flex-shrink: 0;
      color: #94a3b8;
      pointer-events: none;
    }
    .tool-dropdown-menu {
      display: none;
      position: absolute;
      left: 0;
      right: auto;
      top: calc(100% + 4px);
      z-index: 30;
      width: max-content;
      min-width: 9.5rem;
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 0.375rem;
      box-shadow: 0 4px 12px rgb(0 0 0 / 0.1);
      padding: 0.25rem 0;
    }
    .tool-dropdown-menu.show { display: block; }
    .tool-dropdown-menu button {
      display: flex;
      align-items: center;
      width: 100%;
      text-align: left;
      border: none;
      border-radius: 0;
      padding: 0.375rem 0.75rem;
      font-size: 0.75rem;
      background: #fff;
      cursor: pointer;
      white-space: nowrap;
    }
    .tool-dropdown-menu button:hover { background: #f1f5f9; }
    .tool-dropdown-divider { border: none; border-top: 1px solid #e2e8f0; margin: 0.25rem 0; }
    .swap-menu { min-width: 11.5rem; left: auto; right: 0; }
    .align-item { display: inline-flex; align-items: center; gap: 0.5rem; white-space: nowrap; }
    .align-item > span:last-child { white-space: nowrap; }
    .align-icon { width: 14px; height: 14px; flex-shrink: 0; color: #64748b; }
    .collab-panel {
      display: flex;
      flex-direction: column;
      gap: 0.375rem;
      padding: 0.5rem 0 0.125rem;
      border-bottom: 1px solid #f1f5f9;
      margin-bottom: 0.125rem;
    }
    .collab-room-row {
      display: flex;
      align-items: center;
      gap: 0.375rem;
    }
    .collab-room {
      margin: 0;
      flex: 1;
      min-width: 0;
      font-size: 0.6875rem;
      color: #64748b;
      line-height: 1.4;
      word-break: break-all;
    }
    .collab-room .room-id-code {
      font-family: Tahoma, sans-serif;
      font-size: 0.6875rem;
      font-weight: 600;
      color: #dc2626;
      background: none;
      padding: 0;
    }
    .collab-refresh-btn {
      flex-shrink: 0;
      width: 1.625rem;
      height: 1.625rem;
      padding: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid #e2e8f0;
      border-radius: 0.25rem;
      background: #fff;
      cursor: pointer;
    }
    .collab-refresh-btn:hover { background: #f8fafc; }
    .collab-refresh-icon {
      width: 0.875rem;
      height: 0.875rem;
      color: #475569;
      pointer-events: none;
    }
    .collab-action-row {
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 0.5rem;
    }
    .collab-share-btn {
      flex: 1;
      min-width: 0;
      width: auto;
      font-size: 0.8125rem;
      min-height: 2.125rem;
    }
    .collab-status {
      margin: 0;
      flex-shrink: 0;
      font-size: 0.75rem;
      line-height: 1.4;
      color: #64748b;
      white-space: nowrap;
    }
    .collab-status.connected { color: #047857; }
    .collab-status.disconnected { color: #b45309; }
    .collab-status.error { color: #dc2626; }
  </style>
</head>
<body>

  <header class="app-header">
    <div class="app-title-wrap">
      <h2 class="app-title" data-i18n="appTitle">未來素養教學輔助工具</h2>
      <p class="app-subtitle" data-i18n="appSubtitle">ー 未來輪（Future Wheel）</p>
    </div>
  </header>

  <div class="app-body">
  <aside class="sidebar">
    <div id="load-error"></div>
    <div class="sidebar-top">
      <div class="title-row">
        <h1 data-i18n="title">未來輪</h1>
        <select id="lang-select">
          <option value="zh">中文</option>
          <option value="en">EN</option>
        </select>
      </div>
      <div class="collab-panel">
        <div class="collab-room-row">
          <p class="collab-room"><span data-i18n="collabRoom">協作房間</span>：<code id="room-id" class="room-id-code"></code></p>
          <button id="btn-refresh-room" type="button" class="collab-refresh-btn" data-i18n-title="collabRefreshRoom" aria-label="重新連線">
            <svg class="collab-refresh-icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M9.2 1.2 4.4 8.6H7.5L6.1 14.8 11.8 7.4H8.7l.5-6.2z" fill="currentColor"/></svg>
          </button>
        </div>
        <div class="collab-action-row">
          <button id="btn-copy-link" type="button" class="collab-share-btn" data-i18n="copyCollabLink">協作連結</button>
          <p id="collab-status" class="collab-status">連線中…</p>
        </div>
      </div>
      <div class="sidebar-actions">
        <button id="btn-new-wheel" type="button" class="btn-primary btn-new-wheel">
          <svg class="btn-new-icon" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="5.5" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M8 5.5v5M5.5 8h5" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
          <span data-i18n="newWheel">新建未來輪</span>
        </button>
        <div class="data-io">
          <button id="btn-reset" class="btn-danger" data-i18n="reset">重新排列</button>
          <button id="btn-undo" class="toolbar-btn" data-i18n="undo">復原</button>
          <button id="btn-redo" class="toolbar-btn" data-i18n="redo">重做</button>
        </div>
        <div class="data-io">
          <button id="btn-import-data" type="button" class="tool-icon-btn" data-i18n-title="importData" aria-label="資料導入">
            <svg class="tool-icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M1.2 8h5.8" fill="none" stroke="currentColor" stroke-width="1.55" stroke-linecap="round"/><path d="M5.8 8 3.1 5.3v5.4z" fill="currentColor"/><circle cx="11.2" cy="8" r="2.15" fill="none" stroke="currentColor" stroke-width="1.25"/><circle cx="11.2" cy="5.35" r="0.95" fill="currentColor" opacity="0.45"/><circle cx="13.35" cy="9.35" r="0.95" fill="currentColor" opacity="0.45"/><circle cx="9.05" cy="9.35" r="0.95" fill="currentColor" opacity="0.45"/><path d="M11.2 8V5.9M11.2 8l1.85-1.35M11.2 8l-1.85 1.35" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round"/></svg>
          </button>
          <button id="btn-export-data" type="button" class="tool-icon-btn" data-i18n-title="exportData" aria-label="資料導出">
            <svg class="tool-icon" viewBox="0 0 16 16" aria-hidden="true"><circle cx="4.8" cy="8" r="2.15" fill="none" stroke="currentColor" stroke-width="1.25"/><circle cx="4.8" cy="5.35" r="0.95" fill="currentColor" opacity="0.45"/><circle cx="6.95" cy="9.35" r="0.95" fill="currentColor" opacity="0.45"/><circle cx="2.65" cy="9.35" r="0.95" fill="currentColor" opacity="0.45"/><path d="M4.8 8V5.9M4.8 8l1.85-1.35M4.8 8l-1.85 1.35" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round"/><path d="M9 8h5.8" fill="none" stroke="currentColor" stroke-width="1.55" stroke-linecap="round"/><path d="M13.6 8l2.7-2.2v4.4z" fill="currentColor"/></svg>
          </button>
          <button id="btn-export-image" type="button" class="tool-icon-btn" data-i18n-title="exportImage" aria-label="匯出圖片">
            <svg class="tool-icon" viewBox="0 0 16 16" aria-hidden="true"><circle cx="4.8" cy="8" r="2.15" fill="none" stroke="currentColor" stroke-width="1.25"/><circle cx="4.8" cy="5.35" r="0.95" fill="currentColor" opacity="0.45"/><circle cx="6.95" cy="9.35" r="0.95" fill="currentColor" opacity="0.45"/><circle cx="2.65" cy="9.35" r="0.95" fill="currentColor" opacity="0.45"/><path d="M4.8 8V5.9M4.8 8l1.85-1.35M4.8 8l-1.85 1.35" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round"/><rect x="3.6" y="6.8" width="2.4" height="2.2" rx="0.3" fill="none" stroke="currentColor" stroke-width="0.85" opacity="0.85"/><path d="M9 8h5.8" fill="none" stroke="currentColor" stroke-width="1.55" stroke-linecap="round"/><path d="M13.6 8l2.7-2.2v4.4z" fill="currentColor"/></svg>
          </button>
          <input type="file" id="import-file" accept=".json,.txt,application/json,text/plain" class="hidden" />
        </div>
      </div>
    </div>

    <div class="toolbar">
      <div class="sidebar-section">
        <span class="sidebar-label" data-i18n="toolsLabel">調整工具</span>
        <div class="tools-row">
          <button id="btn-display-mode" type="button" class="toolbar-btn tool-icon-btn" data-i18n-title="displayBw" aria-label="黑白顯示">
            <svg id="icon-display-bw" class="tool-icon" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6" fill="currentColor"/><path d="M8 2a6 6 0 0 1 0 12z" fill="#fff"/></svg>
            <svg id="icon-display-color" class="tool-icon hidden" viewBox="0 0 16 16" aria-hidden="true"><circle cx="5" cy="6" r="2.2" fill="currentColor"/><circle cx="10.5" cy="5" r="2.2" fill="currentColor" opacity="0.75"/><circle cx="11" cy="10" r="2.2" fill="currentColor" opacity="0.55"/><circle cx="6" cy="11" r="2.2" fill="currentColor" opacity="0.85"/></svg>
          </button>

    function applyRemoteSettings(settings, applyVisuals = true) {
      if (!settings || typeof settings !== 'object') return;
      collabSuppressPush = true;
      try {
        if (typeof settings.colorMode === 'boolean') {
          colorMode = settings.colorMode;
          saveDisplayMode();
          updateColorControlsState();
          updateDisplayModeButton();
        }
        if (settings.nodeColors) Object.assign(nodeColors, settings.nodeColors);
        if (settings.strokeWidths) Object.assign(strokeWidths, settings.strokeWidths);
        if (settings.strokeColors) Object.assign(strokeColors, settings.strokeColors);
        NODE_KINDS.forEach(k => {
          if (!nodeColors[k]) nodeColors[k] = COLOR_DEFAULTS[k];
        });
        ['circle', 'arrow'].forEach(k => {
          if (strokeWidths[k] == null || strokeWidths[k] === '') strokeWidths[k] = STROKE_DEFAULTS[k];
          if (!strokeColors[k]) strokeColors[k] = STROKE_COLOR_DEFAULTS[k];
        });
        syncColorInputs();
        syncStrokeInputs();
        try { localStorage.setItem(COLOR_STORAGE_KEY, JSON.stringify(nodeColors)); } catch (_) {}
        try { localStorage.setItem(STROKE_STORAGE_KEY, JSON.stringify(strokeWidths)); } catch (_) {}
        try { localStorage.setItem(STROKE_COLOR_STORAGE_KEY, JSON.stringify(strokeColors)); } catch (_) {}
        if (applyVisuals) {
          applyNodeColors();
          applyStrokeStyles();
          if (network) network.redraw();
        }
      } finally {
        collabSuppressPush = false;
      }

        const remoteAt = yWheel.get('updatedAt') || 0;
        const snap = yWheel.get('snapshot');
        if (snap && shouldApplyRemoteSnapshot(remoteAt, rev)) {
          lastSeenRev = rev;
          lastSeenSettingsRev = Math.max(lastSeenSettingsRev, yWheel.get('settingsRev') || 0);

        } else {
          lastSeenRev = Math.max(lastSeenRev, rev);

    function shouldApplyRemoteSnapshot(remoteAt, remoteRev) {
      if (!nodes.get().length) return true;

      if (remoteAt > localSavedAt) return true;
      if (remoteAt === localSavedAt && remoteRev > lastSeenRev) return true;

          try { applyRemoteSettings(JSON.parse(settingsStr), false); } catch (_) {}

        if (!data?.nodes) return;
        const hadNodes = nodes.get().length > 0;
        nextId = data.nextId || 100;
        nodes.clear();

            fontBold: n._fontBold,
            fontItalic: n._fontItalic,
            skipTranslate: n._skipTranslate,
            nodeShape: n._nodeShape,
          });
        });
        edges.add(data.edges || []);
        data.nodes.forEach(n => network.moveNode(n.id, n.x, n.y));
        if (!hadNodes && data.nodes.length) addDemoTemplateNodes();
        applyNodeColors();
        applyStrokeStyles();
        network.redraw();
        updateNodeCountDisplay();
        localSavedAt = data.savedAt || yWheel?.get('updatedAt') || Date.now();
        bootHydratedFromLocal = true;
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch (_) {}
      } catch (_) {
      } finally {
        historyPaused = false;
        collabApplying = false;
      }
    }

      const positions = network ? network.getPositions() : {};
      nodes.get().forEach(n => {
        const locked = remoteLocks.has(n.id);
        const p = positions[n.id];
        nodes.update({
          id: n.id,
          fixed: locked && p ? { x: p.x, y: p.y } : false,
          ...nodeSizePayload(n),
        });
      });
    }

    function acquireLock(nodeId) {
      if (!yLocks) return true;
      const existing = yLocks.get(nodeId);
      if (existing?.clientId && existing.clientId !== clientId) return false;
      yLocks.set(nodeId, { clientId, at: Date.now() });
      return true;
    }

    function releaseLock(nodeId) {
      if (!yLocks) return;
      const existing = yLocks.get(nodeId);
      if (existing?.clientId === clientId) yLocks.delete(nodeId);
    }

    function releaseAllMyLocks() {
      if (!yLocks) return;
      [...myDragging].forEach(id => {
        releaseLock(id);
        if (yLivePos) yLivePos.delete(id);
      });
      myDragging.clear();
    }

    function drawRemoteLockIndicators(ctx) {
      if (!network || !remoteLocks.size) return;
      const positions = network.getPositions();
      remoteLocks.forEach((_, nodeId) => {
        const n = nodes.get(nodeId);
        const p = positions[nodeId];
        if (!n || !p) return;
        const r = getNodeRadius(n) + 5;
        ctx.save();
        ctx.beginPath();
        ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
        ctx.strokeStyle = 'rgba(148, 163, 184, 0.9)';
        ctx.lineWidth = 2;
        ctx.setLineDash([6, 4]);
        ctx.stroke();
        ctx.restore();
      });
    }

    function setupYjsObservers() {
      yWheel.observe(event => {
        if (collabApplying) return;
        let shouldApply = false;
        let shouldApplySettings = false;
        event.changes.keys.forEach((change, key) => {
          if (change.action === 'delete') return;
          if (key === 'settings' || key === 'settingsRev') shouldApplySettings = true;
          if (key === 'rev' || key === 'snapshot') shouldApply = true;
        });
        if (shouldApplySettings) scheduleRemoteSettingsApply();
        if (shouldApply) scheduleRemoteCollabApply();
      });

      yLivePos.observe(event => {
        if (collabApplying || !network) return;
        event.changes.keys.forEach((change, key) => {
          const val = yLivePos.get(key);
          if (val && val.by !== clientId && Number.isFinite(val.x) && Number.isFinite(val.y)) {
            network.moveNode(key, val.x, val.y);
            const remoteNode = nodes.get(key);
            nodes.update({ id: key, x: val.x, y: val.y, ...(remoteNode ? nodeSizePayload(remoteNode) : {}) });
          }
        });
      });

      yLocks.observe(() => refreshRemoteLocks());
    }

    function onCollabSynced() {
      if (!network || !nodes || !yWheel) return;
      const remoteRev = yWheel.get('rev') || 0;
      const remoteAt = yWheel.get('updatedAt') || 0;
      lastSeenSettingsRev = yWheel.get('settingsRev') || 0;
      const settingsStr = yWheel.get('settings');
      if (settingsStr) {
        try { applyRemoteSettings(JSON.parse(settingsStr), true); } catch (_) {}
      }
      const snap = yWheel.get('snapshot');
      if (snap && shouldApplyRemoteSnapshot(remoteAt, remoteRev)) {
        applyCollabSnapshot(snap, settingsStr);
        lastSeenRev = remoteRev;
      } else if (bootHydratedFromLocal && localSavedAt > remoteAt) {
        lastSeenRev = Math.max(lastSeenRev, remoteRev);
        flushCollabPush();
      } else {
        lastSeenRev = Math.max(lastSeenRev, remoteRev);
      }
      refreshRemoteLocks();
      updateUndoRedoButtons();
    }

    function setupCollabNetworkHooks() {
      if (!network) return;

      network.on('dragStart', params => {
        if (!params.nodes?.length) return;
        ensureAllNodeSizes();
        if (collabEnabled) {
          const allowed = [];
          for (const id of params.nodes) {
            if (remoteLocks.has(id)) {
              showStatus(t('nodeLocked'));
              continue;
            }
            if (!acquireLock(id)) {
              showStatus(t('nodeLocked'));
              continue;
            }
            myDragging.add(id);
            allowed.push(id);
          }
          if (!allowed.length) {
            network.selectNodes([]);
            return;
          }
          if (allowed.length !== params.nodes.length) network.selectNodes(allowed);
        }
        pushHistory();
      });

      network.on('dragging', params => {
        if (params.nodes?.length && !sizeGuardFrame) {
          sizeGuardFrame = requestAnimationFrame(() => {
            sizeGuardFrame = null;
            ensureAllNodeSizes();
          });
        }
        if (!collabEnabled || collabApplying || !yLivePos || !params.nodes?.length) return;
        params.nodes.forEach(id => {
          if (!myDragging.has(id)) return;
          const pos = network.getPositions([id])[id];
          if (!pos) return;
          yLivePos.set(id, { x: pos.x, y: pos.y, by: clientId, t: Date.now() });
        });
      });

      network.on('dragEnd', params => {
        if (params.nodes?.length === 1) {
          const draggedId = params.nodes[0];
          const targetId = findDropTarget(draggedId);
          if (targetId && connectNodesByHierarchy(draggedId, targetId)) {
            showStatus(t('edgeConnected'));
          }
        }
        const draggedIds = params.nodes?.length ? params.nodes : [...myDragging];
        draggedIds.forEach(id => {
          myDragging.delete(id);
          if (yLivePos) yLivePos.delete(id);
          releaseLock(id);
        });
        if (draggedIds.length) ensureAllNodeSizes();
        if (collabEnabled && draggedIds.length) pushCollabSnapshot();
        saveState();
      });
    }

    async function initCollaboration() {
      roomId = ensureRoomInUrl();
      clientId = 'c-' + Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
      updateRoomUI();

      if (location.protocol === 'file:') {
        collabEnabled = false;
        const el = document.getElementById('collab-status');
        if (el) {
          el.classList.add('error');
          el.textContent = t('collabFileProtocol');
        }
        showLoadError(t('collabFileProtocol'));
        return;
      }

      try {
        const Y = await import('https://cdn.jsdelivr.net/npm/yjs@13.6.27/+esm');
        const { WebsocketProvider } = await import('https://cdn.jsdelivr.net/npm/y-websocket@2.1.0/+esm');

        ydoc = new Y.Doc();
        yWheel = ydoc.getMap('wheel');
        yLivePos = ydoc.getMap('livePos');
        yLocks = ydoc.getMap('locks');
        setupYjsObservers();

        connectCollabProvider = function connectCollabProvider(index) {
          if (yProvider) {
            try { yProvider.destroy(); } catch (_) {}
          }
          wsUrlIndex = index;
          const url = COLLAB_WS_URLS[index];
          yProvider = new WebsocketProvider(url, roomId, ydoc, { connect: true });
          bindProviderEvents();
          clearTimeout(connectFallbackTimer);
          connectFallbackTimer = setTimeout(() => {
            if (!collabConnected && index < COLLAB_WS_URLS.length - 1) {
              connectCollabProvider(index + 1);
            }
          }, 5000);
        };

        function bindProviderEvents() {
          yProvider.on('status', ({ status }) => {
            collabConnected = status === 'connected';
            if (collabConnected) clearTimeout(connectFallbackTimer);
            updateCollabStatus();
            if (status === 'disconnected') releaseAllMyLocks();
          });
          yProvider.on('sync', isSynced => {
            collabSynced = isSynced;
            if (isSynced) onCollabSynced();
          });
          yProvider.awareness.on('change', () => updateCollabStatus());
        }
        connectCollabProvider(0);

        collabEnabled = true;
        updateCollabStatus();

        lockRefreshTimer = setInterval(() => {
          if (!yLocks) return;
          const now = Date.now();
          myDragging.forEach(id => yLocks.set(id, { clientId, at: now }));
        }, 4000);

        window.addEventListener('beforeunload', () => {
          releaseAllMyLocks();
          flushCollabPush();
        });
      } catch (err) {
        console.error('Collaboration init failed:', err);
        collabEnabled = false;
        updateCollabStatus();
      }
    }

    function setupCollabUI() {
      const refreshBtn = document.getElementById('btn-refresh-room');
      if (refreshBtn) refreshBtn.addEventListener('click', () => refreshCollabRoom());

      const btn = document.getElementById('btn-copy-link');
      if (!btn) return;
      btn.addEventListener('click', async () => {
        const url = getCollabUrl();
        try {
          await navigator.clipboard.writeText(url);
          showStatus(t('collabLinkCopied'));
          return;
        } catch (_) {}
        const ta = document.createElement('textarea');
        ta.value = url;
        ta.style.position = 'fixed';
        ta.style.left = '-9999px';
        document.body.appendChild(ta);
        ta.select();
        try {
          document.execCommand('copy');
          showStatus(t('collabLinkCopied'));
        } catch (_) {}
        document.body.removeChild(ta);
      });
    }

    /* ── helpers ── */
    function scheduleLivePreview(fn) {
      if (livePreviewFrame) cancelAnimationFrame(livePreviewFrame);
      livePreviewFrame = requestAnimationFrame(() => {
        livePreviewFrame = null;
        fn();
      });
    }

    function captureNumericInputFocus() {
      const el = document.activeElement;
      if (!el || !el.classList.contains('node-size-input')) return null;
      return { id: el.id, start: el.selectionStart, end: el.selectionEnd };
    }

    function restoreNumericInputFocus(snap) {
      if (!snap) return;
      skipNumericSelect = true;
      requestAnimationFrame(() => {
        const el = document.getElementById(snap.id);
        if (el) {
          el.focus({ preventScroll: true });
          if (snap.start != null && snap.end != null) {
            try { el.setSelectionRange(snap.start, snap.end); } catch (_) {}
          }
        }
        requestAnimationFrame(() => { skipNumericSelect = false; });
      });
    }

    function withPreservedInputFocus(fn) {
      const snap = captureNumericInputFocus();
      fn();
      restoreNumericInputFocus(snap);
    }

    function setupNumericInputFocus() {
      document.querySelectorAll('.node-size-input').forEach(el => {
        el.addEventListener('mousedown', e => {
          e.stopPropagation();
          if (document.activeElement !== el) {
            e.preventDefault();
            el.focus({ preventScroll: true });
            el.select();
          }
        });
        el.addEventListener('focus', () => {
          if (skipNumericSelect) return;
          requestAnimationFrame(() => {
            if (document.activeElement === el) el.select();
          });
        });
      });
    }

    function preventCanvasFocusSteal() {
      const canvas = document.querySelector('#network canvas');
      if (canvas && canvas.getAttribute('tabindex') !== '-1') {
        canvas.setAttribute('tabindex', '-1');
      }
    }
    function normalizeKind(kind) {
      if (kind === 'secondary') return 'indirect';
      return kind;
    }

    function kindLevel(kind) {
      return KIND_LEVEL[normalizeKind(kind)] ?? -1;
    }

    function resolveHierarchyLink(idA, idB) {
      const a = nodes.get(idA);
      const b = nodes.get(idB);
      if (!a || !b) return null;
      const la = kindLevel(a.kind);
      const lb = kindLevel(b.kind);
      if (la < 0 || lb < 0 || la === lb) return null;
      if (Math.abs(la - lb) !== 1) return null;
      return la < lb ? { from: idA, to: idB } : { from: idB, to: idA };
    }

    function darkenHex(hex, factor = 0.62) {
      const h = hex.replace('#', '');
      const n = h.length === 3 ? h.split('').map(c => c + c).join('') : h;
      const rgb = [0, 2, 4].map(i => parseInt(n.slice(i, i + 2), 16));
      return '#' + rgb.map(c => Math.max(0, Math.min(255, Math.floor(c * factor))).toString(16).padStart(2, '0')).join('');
    }

    function nodeColorObj(kind) {
      const k = normalizeKind(kind);
      if (!colorMode) {
        if (k === 'core') {
          return {
            background: BW_CORE_FILL,
            border: BW_CORE_BORDER,
            highlight: { background: BW_CORE_FILL, border: BW_CORE_BORDER },
          };
        }
        return {
          background: BW_HOLLOW_BG,
          border: BW_HOLLOW_BORDER,
          highlight: { background: BW_HOLLOW_BG, border: BW_HOLLOW_BORDER },
        };
      }
      const bg = nodeColors[k] || COLOR_DEFAULTS[k];
      const border = circleBorderColor();
      return { background: bg, border, highlight: { background: bg, border } };
    }

    function circleBorderColor() {
      if (!colorMode) return BW_HOLLOW_BORDER;
      return strokeColors.circle || STROKE_COLOR_DEFAULTS.circle;
    }

    function edgeColorObj() {
      if (!colorMode) {
        return { color: '#64748b', highlight: '#475569' };
      }
      const c = strokeColors.arrow || STROKE_COLOR_DEFAULTS.arrow;
      return { color: c, highlight: darkenHex(c, 0.85) };
    }

    function countNodesByKind() {
      const counts = { core: 0, direct: 0, indirect: 0, chain: 0 };
      if (!nodes) return counts;
      nodes.get().forEach(n => {
        const k = normalizeKind(n.kind);
        if (counts[k] != null) counts[k] += 1;
      });
      return counts;
    }

    function updateNodeCountDisplay() {
      const counts = countNodesByKind();
      NODE_KINDS.forEach(kind => {
        const el = document.getElementById(`count-${kind}`);
        if (el) el.textContent = String(counts[kind] ?? 0);
      });
    }

    function baseNodeSize(kind) {
      return NODE_STYLE[normalizeKind(kind)]?.size || 20;
    }

    function nodeSizeFactor(node) {
      if (node?._sizeFactor != null && node._sizeFactor !== '') {
        const n = parseFloat(node._sizeFactor);
        if (Number.isFinite(n) && n > 0) return n;
      }
      return 1;
    }

    function scaledNodeSize(kind) {
      return scaledNodeSizeForNode({ kind });
    }

    function scaledNodeSizeForNode(node) {
      const kind = normalizeKind(node?.kind || node);
      const base = baseNodeSize(kind);
      return Math.max(6, Math.round(base * nodeSizeFactor(node)));
    }

    function baseFontStyle(kind) {
      return NODE_STYLE[normalizeKind(kind)]?.font || NODE_STYLE.indirect.font;
    }

    function nodeFontSize(node) {
      const n = parseFloat(node?._fontSize);
      if (Number.isFinite(n) && n > 0) return Math.round(n);
      return baseFontStyle(node?.kind || node).size || 12;
    }

    function nodeFontBold(node) {
      if (node?._fontBold != null) return !!node._fontBold;
      return !!baseFontStyle(node?.kind || node).bold;
    }

    function nodeFontItalic(node) {
      if (node?._fontItalic != null) return !!node._fontItalic;
      return false;
    }

    function buildNodeFont(node) {
      const kind = normalizeKind(node?.kind || node);
      const base = baseFontStyle(kind);
      return {
        ...base,
        size: nodeFontSize(node),
        bold: nodeFontBold(node),
        ital: nodeFontItalic(node),
        multi: true,
        face: FONT_FAMILY,
        strokeWidth: 2,
        strokeColor: '#f8fafc',
      };
    }

    function nodeFontPayload(node) {
      if (!node) return {};
      const payload = { font: buildNodeFont(node) };
      if (node._fontSize != null && node._fontSize !== '') payload._fontSize = node._fontSize;
      if (node._fontBold != null) payload._fontBold = node._fontBold;
      if (node._fontItalic != null) payload._fontItalic = node._fontItalic;
      return payload;
    }

    function nodeShapeKey(node) {
      const s = node?._nodeShape;
      return NODE_SHAPE_KEYS.includes(s) ? s : 'circle';
    }

    function nodeShapeDimensions(size) {
      const r = size;
      // Vis.js box/ellipse size from label text; we draw labels separately, so use constraints
      // sized to match the circle radius (diameter = 2r).
      return { width: Math.round(r * 2.2), height: Math.round(r * 1.6) };
    }

    function nodeShapeVisProps(shapeKey, node) {
      const kind = normalizeKind(node?.kind);
      const size = node?.size ?? scaledNodeSizeForNode({ kind, _sizeFactor: nodeSizeFactor(node || { kind }) });
      if (shapeKey === 'ellipse') {
        const { width, height } = nodeShapeDimensions(size);
        return {
          shape: 'ellipse',
          size,
          widthConstraint: width,
          heightConstraint: height,
        };
      }
      if (shapeKey === 'box') {
        const { width, height } = nodeShapeDimensions(size);
        return {
          shape: 'box',
          size,
          widthConstraint: width,
          heightConstraint: height,
          shapeProperties: { borderRadius: 0 },
        };
      }
      if (shapeKey === 'boxRounded') {
        const { width, height } = nodeShapeDimensions(size);
        return {
          shape: 'box',
          size,
          widthConstraint: width,
          heightConstraint: height,
          shapeProperties: { borderRadius: Math.max(4, Math.round(size * 0.35)) },
        };
      }
      return { shape: 'dot', size, widthConstraint: false, heightConstraint: false };
    }

    function nodeShapePayload(node) {
      if (!node) return {};
      const shapeKey = nodeShapeKey(node);
      const props = nodeShapeVisProps(shapeKey, node);
      const payload = { ...props };
      if (shapeKey !== 'circle') payload._nodeShape = shapeKey;
      return payload;
    }

    function nodeSizePayload(node) {
      if (!node) return {};
      const kind = normalizeKind(node.kind);
      const factor = nodeSizeFactor(node);
      const sized = { ...node, kind, _sizeFactor: factor };
      const size = scaledNodeSizeForNode(sized);
      return {
        _sizeFactor: node._sizeFactor != null && node._sizeFactor !== '' ? node._sizeFactor : factor,
        size,
        ...nodeFontPayload(node),
        ...nodeShapeVisProps(nodeShapeKey(node), { ...sized, size }),
        ...(nodeShapeKey(node) !== 'circle' ? { _nodeShape: nodeShapeKey(node) } : {}),
      };
    }

    function ensureAllNodeSizes(ids) {
      if (!nodes) return;
      const list = ids?.length
        ? ids.map(id => nodes.get(id)).filter(Boolean)
        : nodes.get();
      list.forEach(n => nodes.update({ id: n.id, ...nodeSizePayload(n) }));
    }

    function resizeNodes(nodeIds, delta) {
      if (!network || !nodeIds?.length) return false;
      const updates = [];
      nodeIds.forEach(nodeId => {
        let node = nodes.get(nodeId);
        if (!node) return;
        const kind = normalizeKind(node.kind);
        if (node._sizeFactor == null || node._sizeFactor === '') {
          const factor = nodeSizeFactor(node);
          nodes.update({ id: nodeId, _sizeFactor: factor });
          node = nodes.get(nodeId);
        }
        const current = nodeSizeFactor(node);
        const next = Math.min(SIZE_MAX, Math.max(SIZE_MIN, Math.round((current + delta) * 100) / 100));
        const currentPixel = scaledNodeSizeForNode(node);
        const nextPixel = Math.max(6, Math.round(baseNodeSize(kind) * next));
        if (next === current || nextPixel === currentPixel) return;
        updates.push({ nodeId, node, kind, next });
      });
      if (!updates.length) {
        showStatus(t(delta > 0 ? 'sizeAtMax' : 'sizeAtMin'));
        return false;
      }
      pushHistory();
      updates.forEach(({ nodeId, node, kind, next }) => {
        const pos = currentPositions()[nodeId] || { x: node.x ?? 0, y: node.y ?? 0 };
        nodes.update({
          id: nodeId,
          _sizeFactor: next,
          size: scaledNodeSizeForNode({ kind, _sizeFactor: next }),
        });
        applyNodeStyle(nodeId, kind, pos.x, pos.y);
      });
      network.redraw();
      saveState();
      showStatus(t('sizesUpdated'));
      return true;
    }

    function resizeNodeFromMenu(nodeId, delta) {
      resizeNodes([nodeId], delta);
    }

    function resizeSelectedNodes(delta) {
      const ids = getSelectedNodeIds();
      if (!ids.length) return;
      resizeNodes(ids, delta);
    }

    function resizeFontNodes(nodeIds, delta) {
      if (!network || !nodeIds?.length) return false;
      const updates = [];
      nodeIds.forEach(nodeId => {
        const node = nodes.get(nodeId);
        if (!node) return;
        const current = nodeFontSize(node);
        const next = Math.min(FONT_SIZE_MAX, Math.max(FONT_SIZE_MIN, current + delta));
        if (next === current) return;
        updates.push({ nodeId, node, next });
      });
      if (!updates.length) {
        showStatus(t(delta > 0 ? 'fontSizeAtMax' : 'fontSizeAtMin'));
        return false;
      }
      pushHistory();
      updates.forEach(({ nodeId, node, next }) => {
        const patched = { ...node, _fontSize: next };
        nodes.update({ id: nodeId, _fontSize: next, font: buildNodeFont(patched) });
      });
      network.redraw();
      saveState();
      showStatus(t('fontSizesUpdated'));
      return true;
    }

    function resizeSelectedFont(delta) {
      const ids = getSelectedNodeIds();
      if (!ids.length) return false;
      return resizeFontNodes(ids, delta);
    }

    function toggleFontBoldNodes(nodeIds) {
      if (!network || !nodeIds?.length) return false;
      pushHistory();
      nodeIds.forEach(nodeId => {
        const node = nodes.get(nodeId);
        if (!node) return;
        const next = !nodeFontBold(node);
        const patched = { ...node, _fontBold: next };
        nodes.update({ id: nodeId, _fontBold: next, font: buildNodeFont(patched) });
      });
      network.redraw();
      saveState();
      const sample = nodes.get(nodeIds[0]);
      showStatus(t(nodeFontBold(sample) ? 'fontBoldOn' : 'fontBoldOff'));
      return true;
    }

    function toggleFontItalicNodes(nodeIds) {
      if (!network || !nodeIds?.length) return false;
      pushHistory();
      nodeIds.forEach(nodeId => {
        const node = nodes.get(nodeId);
        if (!node) return;
        const next = !nodeFontItalic(node);
        const patched = { ...node, _fontItalic: next };
        nodes.update({ id: nodeId, _fontItalic: next, font: buildNodeFont(patched) });
      });
      network.redraw();
      saveState();
      const sample = nodes.get(nodeIds[0]);
      showStatus(t(nodeFontItalic(sample) ? 'fontItalicOn' : 'fontItalicOff'));
      return true;
    }

    function toggleSelectedFontBold() {
      const ids = getSelectedNodeIds();
      if (!ids.length) return false;
      return toggleFontBoldNodes(ids);
    }

    function toggleSelectedFontItalic() {
      const ids = getSelectedNodeIds();
      if (!ids.length) return false;
      return toggleFontItalicNodes(ids);
    }

    function isResizePlusKey(e) {
      return e.key === '+' || e.code === 'NumpadAdd' || (e.code === 'Equal' && e.shiftKey);
    }

    function isResizeMinusKey(e) {
      return e.key === '-' || e.code === 'Minus' || e.code === 'NumpadSubtract';
    }

    function getSelectedNodeIds() {
      if (!network) return [];
      const ids = network.getSelectedNodes() || [];
      if (ids.length) return ids;
      if (pendingMarqueeSelection?.length) return pendingMarqueeSelection.slice();
      return [];
    }

    function shouldSuppressBlankClick() {
      return Date.now() < suppressBlankClickUntil;
    }

    function handleZoomOrResizeKey(e) {
      const tag = document.activeElement?.tagName;
      const inField = tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT';
      if (e.repeat || inField || !network) return false;
      if (!isResizePlusKey(e) && !isResizeMinusKey(e)) return false;
      e.preventDefault();
      e.stopPropagation();
      const ids = getSelectedNodeIds();
      const plus = isResizePlusKey(e);
      const resizeCircle = e.ctrlKey || e.metaKey;
      if (ids.length) {
        if (resizeCircle) {
          resizeNodes(ids, plus ? SIZE_STEP : -SIZE_STEP);
        } else {
          resizeFontNodes(ids, plus ? FONT_SIZE_STEP : -FONT_SIZE_STEP);
        }
        if (!network.getSelectedNodes().length) network.selectNodes(ids);
        pendingMarqueeSelection = null;
      } else {
        zoomCanvas(plus ? 1 : -1);
      }
      return true;
    }

    const CANVAS_ZOOM_STEP = 1.12;
    const CANVAS_ZOOM_MIN = 0.15;
    const CANVAS_ZOOM_MAX = 4;

    function zoomCanvas(delta) {
      if (!network) return;
      const scale = network.getScale();
      const factor = delta > 0 ? CANVAS_ZOOM_STEP : 1 / CANVAS_ZOOM_STEP;
      const next = Math.min(CANVAS_ZOOM_MAX, Math.max(CANVAS_ZOOM_MIN, scale * factor));
      if (Math.abs(next - scale) < 1e-6) return;
      network.moveTo({ scale: next, animation: false });
    }

    function parseStrokeWidth(key) {
      const raw = String(strokeWidths[key] ?? STROKE_DEFAULTS[key]).trim();
      const n = parseFloat(raw);
      const fallback = parseFloat(STROKE_DEFAULTS[key]);
      return Number.isFinite(n) && n > 0 ? n : fallback;
    }

    function circleBorderWidth() { return parseStrokeWidth('circle'); }
    function edgeLineWidth() { return parseStrokeWidth('arrow'); }

    function currentPositions() {
      return network ? network.getPositions() : {};
    }

    function restoreAllPositions(positions) {
      if (!network || !positions) return;
      Object.entries(positions).forEach(([id, p]) => network.moveNode(id, p.x, p.y));
    }

    function buildGroups() {
      const groups = {};
      NODE_KINDS.forEach(kind => {
        const style = NODE_STYLE[kind];
        groups[kind] = {
          shape: 'dot',
          borderWidth: circleBorderWidth(),
          color: nodeColorObj(kind),
          font: {
            ...style.font,
            multi: true,
            face: FONT_FAMILY,
            strokeWidth: 2,
            strokeColor: '#f8fafc',
          },
        };
      });
      return groups;
    }

    function loadNodeColors() {
      nodeColors = { ...COLOR_DEFAULTS };
      try {
        const saved = JSON.parse(localStorage.getItem(COLOR_STORAGE_KEY));
        if (saved) Object.assign(nodeColors, saved);
      } catch (_) {}
      NODE_KINDS.forEach(k => {
        if (!nodeColors[k]) nodeColors[k] = COLOR_DEFAULTS[k];
      });
    }

    function saveNodeColors() {
      try { localStorage.setItem(COLOR_STORAGE_KEY, JSON.stringify(nodeColors)); } catch (_) {}
      syncCollabSettings();
    }

    function loadStrokeWidths() {
      strokeWidths = { ...STROKE_DEFAULTS };
      try {
        const saved = JSON.parse(localStorage.getItem(STROKE_STORAGE_KEY));
        if (saved) Object.assign(strokeWidths, saved);
      } catch (_) {}
      ['circle', 'arrow'].forEach(k => {
        if (strokeWidths[k] == null || strokeWidths[k] === '') strokeWidths[k] = STROKE_DEFAULTS[k];
      });
    }

    function saveStrokeWidths() {
      try { localStorage.setItem(STROKE_STORAGE_KEY, JSON.stringify(strokeWidths)); } catch (_) {}
      syncCollabSettings();
    }

    function loadStrokeColors() {
      strokeColors = { ...STROKE_COLOR_DEFAULTS };
      try {
        const saved = JSON.parse(localStorage.getItem(STROKE_COLOR_STORAGE_KEY));
        if (saved) Object.assign(strokeColors, saved);
      } catch (_) {}
      ['circle', 'arrow'].forEach(k => {
        if (!strokeColors[k]) strokeColors[k] = STROKE_COLOR_DEFAULTS[k];
      });
    }

    function saveStrokeColors() {
      try { localStorage.setItem(STROKE_COLOR_STORAGE_KEY, JSON.stringify(strokeColors)); } catch (_) {}
      syncCollabSettings();
    }

    function syncColorInputs() {
      NODE_KINDS.forEach(kind => {
        const el = document.getElementById(`color-${kind}`);
        if (el) el.value = nodeColors[kind];
      });
    }

    function syncStrokeInputs() {
      const circleEl = document.getElementById('stroke-circle');
      const arrowEl = document.getElementById('stroke-arrow');
      const circleColorEl = document.getElementById('color-stroke-circle');
      const arrowColorEl = document.getElementById('color-stroke-arrow');
      if (circleEl) circleEl.value = strokeWidths.circle;
      if (arrowEl) arrowEl.value = strokeWidths.arrow;
      if (circleColorEl) circleColorEl.value = strokeColors.circle;
      if (arrowColorEl) arrowColorEl.value = strokeColors.arrow;
    }

    function applyStrokeStyles() {
      if (!network) return;
      withPreservedInputFocus(() => {
        const bw = circleBorderWidth();
        const ew = edgeLineWidth();
        const ec = edgeColorObj();
        const positions = currentPositions();
        if (nodes) {
          nodes.get().forEach(n => {
            const p = positions[n.id];
            const kind = normalizeKind(n.kind);
            nodes.update({
              id: n.id,
              borderWidth: bw,
              color: nodeColorObj(kind),
              ...nodeSizePayload(n),
              ...(p ? { x: p.x, y: p.y } : {}),
            });
          });
        }
        if (edges) {
          edges.get().forEach(e => edges.update({ id: e.id, width: ew, color: ec }));
        }
        network.setOptions({
          nodes: { borderWidth: bw },
          edges: { width: ew, color: ec },
          groups: buildGroups(),
        });
        restoreAllPositions(positions);
        preventCanvasFocusSteal();
        network.redraw();
      });
    }

    function applyNodeColors() {
      if (!nodes || !network) return;
      withPreservedInputFocus(() => {
        const positions = currentPositions();
        nodes.get().forEach(n => {
          const kind = normalizeKind(n.kind);
          const style = NODE_STYLE[kind] || NODE_STYLE.indirect;
          const p = positions[n.id];
          const factor = nodeSizeFactor(n);
          const sizePayload = n._sizeFactor != null && n._sizeFactor !== ''
            ? {}
            : { _sizeFactor: factor };
          nodes.update({
            id: n.id,
            kind,
            group: kind,
            label: nodeDisplayLabel(),
            color: nodeColorObj(kind),
            size: scaledNodeSizeForNode({ ...n, _sizeFactor: factor }),
            ...sizePayload,
            borderWidth: circleBorderWidth(),
            ...(p ? { x: p.x, y: p.y } : {}),
            font: buildNodeFont(n),
          });
        });
        network.setOptions({
          nodes: { borderWidth: circleBorderWidth() },
          groups: buildGroups(),
        });
        restoreAllPositions(positions);
        preventCanvasFocusSteal();
        network.redraw();
      });
    }

    function applyNodeStyle(id, kind, x, y) {
      kind = normalizeKind(kind);
      const existing = nodes.get(id);
      const style = NODE_STYLE[kind] || NODE_STYLE.indirect;
      const p = x != null && y != null ? { x, y } : currentPositions()[id];
      const factor = nodeSizeFactor(existing || { kind });
      const sizeFactorPatch = existing?._sizeFactor != null && existing._sizeFactor !== ''
        ? {}
        : { _sizeFactor: factor };
      nodes.update({
        id,
        kind,
        group: kind,
        label: nodeDisplayLabel(),
        color: nodeColorObj(kind),
        size: scaledNodeSizeForNode({ ...(existing || { kind }), _sizeFactor: factor }),
        ...sizeFactorPatch,
        borderWidth: circleBorderWidth(),
        ...(existing?._sizeFactor != null ? { _sizeFactor: existing._sizeFactor } : {}),
        ...(existing?._raw != null ? { _raw: existing._raw } : {}),
        ...(p ? { x: p.x, y: p.y } : {}),
        ...nodeFontPayload(existing || { kind }),
        ...nodeShapePayload(existing || { kind, _sizeFactor: factor, size: scaledNodeSizeForNode({ ...(existing || { kind }), _sizeFactor: factor }) }),
      });
    }

    function loadDisplayMode() {
      try {
        const saved = localStorage.getItem(DISPLAY_MODE_KEY);
        if (saved === 'bw') colorMode = false;
        else if (saved === 'color') colorMode = true;
      } catch (_) {}
    }

    function saveDisplayMode() {
      try { localStorage.setItem(DISPLAY_MODE_KEY, colorMode ? 'color' : 'bw'); } catch (_) {}
    }

    function updateColorControlsState() {
      NODE_KINDS.forEach(kind => {
        const el = document.getElementById(`color-${kind}`);
        if (!el) return;
        el.disabled = !colorMode;
        el.tabIndex = colorMode ? 0 : -1;
      });
      ['color-stroke-circle', 'color-stroke-arrow'].forEach(id => {
        const el = document.getElementById(id);
        if (!el) return;
        el.disabled = !colorMode;
        el.tabIndex = colorMode ? 0 : -1;
      });
    }

    function updateDisplayModeButton() {
      const btn = document.getElementById('btn-display-mode');
      const iconBw = document.getElementById('icon-display-bw');
      const iconColor = document.getElementById('icon-display-color');
      if (!btn) return;
      const titleKey = colorMode ? 'displayBw' : 'displayColor';
      const label = t(titleKey);
      btn.dataset.i18nTitle = titleKey;
      btn.title = label;
      btn.setAttribute('aria-label', label);
      btn.classList.toggle('active', !colorMode);
      if (iconBw) iconBw.classList.toggle('hidden', !colorMode);
      if (iconColor) iconColor.classList.toggle('hidden', colorMode);
    }

    function updateCanvasPanButton() {
      const btn = document.getElementById('btn-canvas-pan');
      if (!btn) return;
      btn.classList.toggle('active', canvasPanMode);
    }

    function setCanvasPanMode(on) {
      canvasPanMode = on;
      localStorage.setItem(PAN_MODE_KEY, on ? '1' : '0');
      updateCanvasPanButton();
      if (network) network.setOptions({ interaction: { dragView: canvasPanMode, keyboard: { enabled: false } } });
      showStatus(canvasPanMode ? t('canvasPanOn') : t('canvasPanOff'));
    }

    function setColorMode(on) {
      colorMode = on;
      saveDisplayMode();
      updateColorControlsState();
      updateDisplayModeButton();
      applyNodeColors();
      applyStrokeStyles();
      pushCollabSettingsNow();
      showStatus(colorMode ? t('displayColorOn') : t('displayBwOn'));
    }

    function setupColorPickers() {
      NODE_KINDS.forEach(kind => {
        document.getElementById(`color-${kind}`).addEventListener('input', e => {
          if (!colorMode) return;
          nodeColors[kind] = e.target.value;
          saveNodeColors();
          applyNodeColors();
          showStatus(t('colorsUpdated'));
        });
      });
    }

    function setupStrokeColorPickers() {
      [
        { id: 'color-stroke-circle', key: 'circle' },
        { id: 'color-stroke-arrow', key: 'arrow' },
      ].forEach(({ id, key }) => {
        const el = document.getElementById(id);
        if (!el) return;
        el.addEventListener('input', e => {
          if (!colorMode) return;
          strokeColors[key] = e.target.value;
          saveStrokeColors();
          applyStrokeStyles();
          showStatus(t('strokesUpdated'));
        });
      });
    }

    function setupStrokeInputs() {
      [
        { id: 'stroke-circle', key: 'circle' },
        { id: 'stroke-arrow', key: 'arrow' },
      ].forEach(({ id, key }) => {
        const el = document.getElementById(id);
        const applyLive = () => {
          const raw = el.value.trim();
          const n = parseFloat(raw);
          if (!raw || !Number.isFinite(n) || n <= 0) return;
          strokeWidths[key] = raw;
          scheduleLivePreview(applyStrokeStyles);
        };
        const commit = () => {
          const raw = el.value.trim();
          if (!raw || parseFloat(raw) <= 0) {
            el.value = strokeWidths[key];
            return;
          }
          strokeWidths[key] = raw;
          saveStrokeWidths();
          applyStrokeStyles();
          showStatus(t('strokesUpdated'));
        };
        el.addEventListener('input', applyLive);
        el.addEventListener('change', commit);
        el.addEventListener('keydown', e => {
          if (e.key === 'Enter') { e.preventDefault(); commit(); el.blur(); }
        });
      });
    }

    function newNodeId(kind) {
      const k = normalizeKind(kind);
      const prefix = { core: 'core', direct: 'direct', indirect: 'ind', chain: 'chain' }[k] || 'ind';
      return `${prefix}-${nextId++}`;
    }

    function wrapLabel(text, maxLen = 14) {
      if (!text || !text.trim()) return ' ';
      const tokens = text.trim().match(/[\u4e00-\u9fff\u3400-\u4dbf\u3040-\u30ff]+|[^\s]+/g);
      if (!tokens?.length) return ' ';
      const lines = [];
      let line = '';
      const pushLine = () => {
        if (line) {
          lines.push(line);
          line = '';
        }
      };
      tokens.forEach(token => {
        const candidate = line ? `${line} ${token}` : token;
        if (candidate.length <= maxLen) {
          line = candidate;
          return;
        }
        pushLine();
        if (token.length <= maxLen) {
          line = token;
          return;
        }
        if (/^[\u4e00-\u9fff\u3400-\u4dbf\u3040-\u30ff]+$/.test(token)) {
          for (let i = 0; i < token.length; i += maxLen) lines.push(token.slice(i, i + maxLen));
          line = '';
          return;
        }
        lines.push(token);
      });
      pushLine();
      return lines.length ? lines.join('\n') : ' ';
    }

    const ANNO_KEY_BY_ID = Object.fromEntries(ANNOTATED_NODES.map(a => [a.id, a.key]));

    function nodeDisplayLabel() {
      return ' ';
    }

    function internalNodeText(node) {
      const raw = (node._raw || '').trim();
      if (raw) return wrapLabel(raw);
      const key = ANNO_KEY_BY_ID[node.id];
      return key ? t(key) : '';
    }

    function outwardOffset(nodeId, pos, corePos, radius) {
      const dx = pos.x - corePos.x;
      const dy = pos.y - corePos.y;
      const dist = Math.hypot(dx, dy);
      let ox = 0;
      let oy = -1;
      if (nodeId !== CORE_ID && dist >= 1) {
        ox = dx / dist;
        oy = dy / dist;
      }
      return {
        x: pos.x + ox * (radius + 20),
        y: pos.y + oy * (radius + 20),
      };
    }

    function getRadius() {
      const el = document.getElementById('network');
      const w = el.clientWidth, h = el.clientHeight;
      const canvasMin = Math.min(w, h);
      const coreR = scaledNodeSize('core');
      const directR = scaledNodeSize('direct');
      const minOrbit = coreR + directR + 64;
      const fromCanvas = canvasMin * 0.26;
      return Math.max(minOrbit, Math.min(300, fromCanvas));
    }

    function directPositions(radius) {
      const angles = [-90, 30, 150].map(a => (a * Math.PI) / 180);
      return angles.map(a => ({ x: radius * Math.cos(a), y: radius * Math.sin(a) }));
    }

    function makeNode(id, label, kind, x, y) {
      kind = normalizeKind(kind);
      const style = NODE_STYLE[kind] || NODE_STYLE.indirect;
      return {
        id, label: nodeDisplayLabel(),
        group: kind,
        x, y,
        shape: 'dot',
        size: scaledNodeSize(kind),
        borderWidth: circleBorderWidth(),
        color: nodeColorObj(kind),
        font: buildNodeFont({ kind }),
        kind,
      };
    }

    function applyNodeFontOpts(payload, kind, existing, opts = {}) {
      const merged = { kind, ...existing, ...payload };
      if (opts.fontSize != null) {
        payload._fontSize = opts.fontSize;
        merged._fontSize = opts.fontSize;
      } else if (existing?._fontSize != null) {
        payload._fontSize = existing._fontSize;
        merged._fontSize = existing._fontSize;
      }
      if (opts.fontBold != null) {
        payload._fontBold = opts.fontBold;
        merged._fontBold = opts.fontBold;
      } else if (existing?._fontBold != null) {
        payload._fontBold = existing._fontBold;
        merged._fontBold = existing._fontBold;
      }
      if (opts.fontItalic != null) {
        payload._fontItalic = opts.fontItalic;
        merged._fontItalic = opts.fontItalic;
      } else if (existing?._fontItalic != null) {
        payload._fontItalic = existing._fontItalic;
        merged._fontItalic = existing._fontItalic;
      }
      payload.font = buildNodeFont(merged);
      return payload;
    }

    function updateNodeTextOnly(id, text) {
      const existing = nodes.get(id);
      if (!existing || !network) return;
      const positions = currentPositions();
      const p = positions[id];
      nodes.update({
        id,
        _raw: text,
        label: nodeDisplayLabel(),
        ...nodeSizePayload(existing),
        ...(p ? { x: p.x, y: p.y } : {}),
      });
      if (p) network.moveNode(id, p.x, p.y);
    }

    function commitNode(id, text, kind, x, y, opts = {}) {
      kind = normalizeKind(kind);
      const existing = nodes.get(id);
      const payload = { ...makeNode(id, text, kind, x, y), _raw: text };
      const factor = opts.sizeFactor ?? nodeSizeFactor(existing || { kind });
      payload._sizeFactor = factor;
      payload.size = scaledNodeSizeForNode({ kind, _sizeFactor: factor });
      applyNodeFontOpts(payload, kind, existing, opts);
      if (opts.skipTranslate != null) payload._skipTranslate = !!opts.skipTranslate;
      else if (existing?._skipTranslate) payload._skipTranslate = true;
      const shapeKey = opts.nodeShape != null ? opts.nodeShape : nodeShapeKey(existing);
      if (opts.nodeShape != null) {
        if (shapeKey === 'circle') delete payload._nodeShape;
        else payload._nodeShape = shapeKey;
      } else if (existing?._nodeShape) {
        payload._nodeShape = existing._nodeShape;
      }
      Object.assign(payload, nodeShapeVisProps(shapeKey, { kind, _sizeFactor: factor, size: payload.size }));
      if (nodes.get(id)) nodes.update(payload);
      else nodes.add(payload);
      if (network) network.moveNode(id, x, y);
      applyNodeStyle(id, kind, x, y);
      return id;
    }

    function toggleSkipTranslate(nodeId) {
      const n = nodes.get(nodeId);
      if (!n) return;
      pushHistory();
      const next = !n._skipTranslate;
      if (next) nodes.update({ id: nodeId, _skipTranslate: true });
      else nodes.update({ id: nodeId, _skipTranslate: false });
      saveState();
      showStatus(t(next ? 'skipTranslateOn' : 'skipTranslateOff'));
    }

    function syncNodePositionsFromNetwork(ids) {
      if (!network || !ids?.length) return;
      const positions = network.getPositions(ids);
      ids.forEach(id => {
        const p = positions[id];
        if (!p) return;
        const n = nodes.get(id);
        nodes.update({ id, x: p.x, y: p.y, ...(n ? nodeSizePayload(n) : {}) });
      });
    }

    function showStatus(msg) {
      const el = document.getElementById('status');
      el.textContent = msg;
      if (msg) setTimeout(() => { if (el.textContent === msg) el.textContent = ''; }, 2500);
    }

    function readInputs() {
      const coreNode = nodes.get(CORE_ID);
      if (!coreNode) return { core: DEFAULT_INPUTS.core, directs: [...DEFAULT_INPUTS.directs] };
      return {
        core: coreNode._raw || '',
        directs: DIRECT_IDS.map(id => (nodes.get(id)?._raw || '')),
      };
    }

    function drawCanvasText(ctx, text, x, y, fontSize = 12, bold = false, fillColor = '#1e293b', italic = false) {
      ctx.save();
      const styleBits = [];
      if (italic) styleBits.push('italic');
      if (bold) styleBits.push('bold');
      styleBits.push(`${fontSize}px ${FONT_FAMILY_CSS}`);
      ctx.font = styleBits.join(' ');
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.strokeStyle = '#f8fafc';
      ctx.lineWidth = 4;
      ctx.lineJoin = 'round';
      ctx.fillStyle = fillColor;
      const lines = String(text).split('\n');
      const lineHeight = fontSize + 2;
      const startY = y - ((lines.length - 1) * lineHeight) / 2;
      lines.forEach((line, i) => {
        const ly = startY + i * lineHeight;
        ctx.strokeText(line, x, ly);
        ctx.fillText(line, x, ly);
      });
      ctx.restore();
    }

    function drawInternalNodeLabels(ctx) {
      if (!textOverlap || !network || !nodes) return;
      const positions = network.getPositions();
      nodes.get().forEach(n => {
        const text = internalNodeText(n);
        if (!text) return;
        const pos = positions[n.id];
        if (!pos) return;
        const kind = normalizeKind(n.kind);
        const style = NODE_STYLE[kind] || NODE_STYLE.indirect;
        const isAnnoOnly = !(n._raw || '').trim() && ANNO_KEY_BY_ID[n.id];
        drawCanvasText(
          ctx,
          text,
          pos.x,
          pos.y,
          nodeFontSize(n),
          nodeFontBold(n) || isAnnoOnly,
          isAnnoOnly ? '#475569' : (style.font.color || '#1e293b'),
          nodeFontItalic(n),
        );
      });
    }

    function drawNodeAnnotations(ctx) {
      if (textOverlap || !network || !nodes) return;
      const positions = network.getPositions();
      const corePos = positions[CORE_ID] || { x: 0, y: 0 };
      ANNOTATED_NODES.forEach(({ id, key }) => {
        const node = nodes.get(id);
        const pos = positions[id];
        if (!node || !pos) return;
        const r = getNodeRadius(node);
        const anchor = outwardOffset(id, pos, corePos, r);
        ctx.save();
        ctx.font = `600 12px ${FONT_FAMILY_CSS}`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.strokeStyle = '#f8fafc';
        ctx.lineWidth = 4;
        ctx.lineJoin = 'round';
        ctx.fillStyle = '#475569';
        ctx.strokeText(t(key), anchor.x, anchor.y);
        ctx.fillText(t(key), anchor.x, anchor.y);
        ctx.restore();
      });
    }

    function drawExternalNodeLabels(ctx) {
      if (textOverlap || !network || !nodes) return;
      const positions = network.getPositions();
      const corePos = positions[CORE_ID] || { x: 0, y: 0 };
      nodes.get().forEach(n => {
        const raw = (n._raw || '').trim();
        if (!raw) return;
        const pos = positions[n.id];
        if (!pos) return;
        const kind = normalizeKind(n.kind);
        const style = NODE_STYLE[kind] || NODE_STYLE.indirect;
        const r = getNodeRadius(n);
        const anchor = outwardOffset(n.id, pos, corePos, r);
        drawCanvasText(
          ctx,
          wrapLabel(raw),
          anchor.x,
          anchor.y,
          nodeFontSize(n),
          nodeFontBold(n),
          style.font.color || '#1e293b',
          nodeFontItalic(n),
        );
      });
    }

    function loadTextOverlap() {
      try {
        const saved = localStorage.getItem(TEXT_OVERLAP_KEY);
        if (saved === '0') textOverlap = false;
        else if (saved === '1') textOverlap = true;
      } catch (_) {}
    }

    function saveTextOverlap() {
      try { localStorage.setItem(TEXT_OVERLAP_KEY, textOverlap ? '1' : '0'); } catch (_) {}
    }

    function syncTextOverlapInput() {
      const el = document.getElementById('text-overlap');
      if (el) el.checked = textOverlap;
    }

    function applyTextDisplay() {
      if (!nodes || !network) return;
      const positions = currentPositions();
      nodes.get().forEach(n => {
        const p = positions[n.id];
        nodes.update({
          id: n.id,
          label: nodeDisplayLabel(),
          ...nodeSizePayload(n),
          ...(p ? { x: p.x, y: p.y } : {}),
        });
      });
      restoreAllPositions(positions);
      network.redraw();
    }

    function setupTextOverlapControl() {
      const el = document.getElementById('text-overlap');
      if (!el) return;
      el.addEventListener('change', () => {
        textOverlap = el.checked;
        saveTextOverlap();
        applyTextDisplay();
      });
    }

    function sleep(ms) {
      return new Promise(resolve => setTimeout(resolve, ms));
    }

    function syncTranslateLangDefaults() {
      const source = document.getElementById('translate-source-lang');
      const target = document.getElementById('translate-target-lang');
      if (!source || !target) return;
      if (lang === 'zh') {
        source.value = 'zh-TW';
        target.value = 'en';
      } else {
        source.value = 'en';
        target.value = 'zh-TW';
      }
    }

    async function translateLine(text, langpair) {
      const url = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=${encodeURIComponent(langpair)}`;
      const res = await fetch(url);
      if (!res.ok) throw new Error('network');
      const data = await res.json();
      if (data.quotaFinished) throw new Error('quota');
      const translated = data.responseData?.translatedText;
      if (!translated) throw new Error('bad-response');
      return translated;
    }

    async function translateTextContent(text, langpair) {
      const max = 450;
      if (text.length <= max) return translateLine(text, langpair);
      const parts = [];
      for (let i = 0; i < text.length; i += max) {
        parts.push(await translateLine(text.slice(i, i + max), langpair));
        await sleep(350);
      }
      return parts.join('');
    }

    async function translateAllNodeTexts() {
      if (!network || !nodes) return;
      const sourceLang = document.getElementById('translate-source-lang')?.value || 'zh-TW';
      const targetLang = document.getElementById('translate-target-lang')?.value || 'en';
      if (sourceLang === targetLang) {
        showStatus(t('translateSameLang'));
        return;
      }
      const langpair = `${sourceLang}|${targetLang}`;
      const toTranslate = nodes.get()
        .map(n => ({ id: n.id, raw: (n._raw || '').trim(), kind: normalizeKind(n.kind), skip: !!n._skipTranslate }))
        .filter(n => n.raw && !n.skip);
      if (!toTranslate.length) {
        showStatus(t('translateNothing'));
        return;
      }

      const btn = document.getElementById('btn-translate-text');
      if (btn) btn.disabled = true;
      showStatus(t('translating'));
      pushHistory();
      try {
        for (let i = 0; i < toTranslate.length; i++) {
          const item = toTranslate[i];
          showStatus(t('translatingProgress').replace('{i}', i + 1).replace('{n}', toTranslate.length));
          const translated = await translateTextContent(item.raw, langpair);
          updateNodeTextOnly(item.id, translated);
          network.redraw();
          if (i < toTranslate.length - 1) await sleep(400);
        }
        saveState();
        showStatus(t('translateDone'));
      } catch (_) {
        showStatus(t('translateFailed'));
      } finally {
        if (btn) btn.disabled = false;
      }
    }

    function setupTranslateControl() {
      const btn = document.getElementById('btn-translate-text');
      if (!btn) return;
      btn.addEventListener('click', () => { translateAllNodeTexts(); });
    }

    function buildCoreGraph(inputs, keepSecondary = false) {
      if (!nodes || !edges) return;

      const radius = getRadius();
      const positions = directPositions(radius);

      if (!keepSecondary) {
        const extraIds = nodes.get().filter(n => ['indirect', 'chain', 'secondary'].includes(n.kind)).map(n => n.id);
        if (extraIds.length) {
          nodes.remove(extraIds);
          edges.remove(edges.get({
            filter: e => extraIds.includes(e.from) || extraIds.includes(e.to),
          }).map(e => e.id));
        }
      }

      commitNode(CORE_ID, inputs.core, 'core', 0, 0);

      DIRECT_IDS.forEach((id, i) => {
        const pos = resolveFreePosition(positions[i], 'direct', CORE_ID);
        commitNode(id, inputs.directs[i], 'direct', pos.x, pos.y);
        const edgeId = `e-core-${id}`;
        if (!edges.get(edgeId)) {
          const ep = newEdgeProps();
          edges.add({ id: edgeId, from: CORE_ID, to: id, ...ep });
        }
      });

      applyNodeColors();
      if (network) {
        network.fit({ animation: { duration: 350, easingFunction: 'easeInOutQuad' } });
      }
    }

    function buildFullExample() {
      buildCoreGraph(DEFAULT_INPUTS, false);
      const demos = [
        { label: '教育課程改革', from: 'direct-0' },
        { label: '開源工具興起', from: 'direct-1' },
        { label: '法規跟進壓力', from: 'direct-2' },
      ];
      demos.forEach(d => {
        const pos = positionDemoChild(d.from, 'indirect');
        const id = commitNode(newNodeId('indirect'), d.label, 'indirect', pos.x, pos.y);
        const ep = newEdgeProps();
        edges.add({ id: `e-${id}`, from: d.from, to: id, ...ep });
      });

      addDemoTemplateNodes();
      applyNodeColors();
    }

    function rightBottomDirectId() {
      const positions = network.getPositions();
      let bestId = DIRECT_IDS[0];
      let bestScore = -Infinity;
      DIRECT_IDS.forEach(id => {
        const p = positions[id];
        if (!p) return;
        const score = p.x * 1.15 + p.y;
        if (score > bestScore) {
          bestScore = score;
          bestId = id;
        }
      });
      return bestId;
    }

    function positionDemoChild(parentId, childKind) {
      const positions = network.getPositions();
      const parentPos = positions[parentId] || { x: 0, y: 0 };
      const extra = childKind === 'chain' ? 48 : 64;
      const dist = minDistFromNode(parentId, childKind) + extra;
      const angle = subtreeFanAngle(parentId, 0, 1);
      const preferred = {
        x: parentPos.x + Math.cos(angle) * dist,
        y: parentPos.y + Math.sin(angle) * dist,
      };
      return resolveFreePosition(preferred, childKind, parentId);
    }

    function addDemoTemplateNodes() {
      if (!network || !nodes) return;
      const parentId = rightBottomDirectId();
      const ep = newEdgeProps();

      const indPos = positionDemoChild(parentId, 'indirect');
      commitNode(DEMO_INDIRECT_ID, ' ', 'indirect', indPos.x, indPos.y);
      const indEdgeId = `e-${DEMO_INDIRECT_ID}`;
      if (edges.get(indEdgeId)) {
        edges.update({ id: indEdgeId, from: parentId, to: DEMO_INDIRECT_ID, arrows: ep.arrows, dashes: ep.dashes });
      } else {
        edges.add({ id: indEdgeId, from: parentId, to: DEMO_INDIRECT_ID, ...ep });
      }

      const chainPos = positionDemoChild(DEMO_INDIRECT_ID, 'chain');
      commitNode(DEMO_CHAIN_ID, ' ', 'chain', chainPos.x, chainPos.y);
      const chainEdgeId = `e-${DEMO_CHAIN_ID}`;
      if (edges.get(chainEdgeId)) {
        edges.update({ id: chainEdgeId, from: DEMO_INDIRECT_ID, to: DEMO_CHAIN_ID, arrows: ep.arrows, dashes: ep.dashes });
      } else {
        edges.add({ id: chainEdgeId, from: DEMO_INDIRECT_ID, to: DEMO_CHAIN_ID, ...ep });
      }
    }

    function initNetwork() {
      const container = document.getElementById('network');
      const data = { nodes, edges };
      const options = {
        nodes: {
          borderWidth: circleBorderWidth(),
          shadow: { enabled: true, size: 4, x: 1, y: 1 },
          font: { color: '#1e293b', face: FONT_FAMILY, strokeWidth: 2, strokeColor: '#f8fafc' },
        },
        edges: { width: edgeLineWidth(), color: edgeColorObj(), smooth: { type: 'continuous' } },
        physics: { enabled: false },
        interaction: {
          dragNodes: true,
          dragView: canvasPanMode,
          zoomView: true,
          multiselect: true,
          selectable: true,
          navigationButtons: false,
          keyboard: { enabled: false },
        },
        manipulation: { enabled: false },
        groups: buildGroups(),
      };
      network = new vis.Network(container, data, options);

      network.on('doubleClick', params => {
        hideCtxMenu();
        if (params.nodes.length) {
          editNode(params.nodes[0]);
        } else if (params.pointer && params.pointer.DOM) {
          const pos = network.DOMtoCanvas(params.pointer.DOM);
          addSecondaryAt(pos.x, pos.y);
        }
      });

      network.on('click', params => {
        hideCtxMenu();
        if (!connectMode) {
          if (params.nodes.length === 0 && params.edges.length === 0) {
            if (!shouldSuppressBlankClick()) {
              pendingMarqueeSelection = null;
              network.unselectAll();
            }
          }
          return;
        }
        if (params.nodes.length) {
          const nid = params.nodes[0];
          if (!connectFrom) {
            connectFrom = nid;
            flashHint(t('connectHint2'));
          } else if (connectFrom !== nid) {
            pushHistory();
            if (connectNodesByHierarchy(connectFrom, nid)) showStatus(t('edgeConnected'));
            connectFrom = null;
            setConnectMode(false);
            saveState();
          }
        }
      });

      network.on('select', params => {
