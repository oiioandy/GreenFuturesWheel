        if (params.nodes.length) {
          pendingMarqueeSelection = null;
          showStatus(t('selected').replace('{n}', params.nodes.length));
        }
      });

      setupContextMenu();
      setupMarqueeSelection();
      setupCanvasPan();
      setupCollabNetworkHooks();
      network.on('afterDrawing', ctx => {
        preventCanvasFocusSteal();
        drawInternalNodeLabels(ctx);
        drawNodeAnnotations(ctx);
        drawExternalNodeLabels(ctx);
        drawRemoteLockIndicators(ctx);
      });
    }

    function flashHint(msg) {
      const el = document.querySelector('[data-i18n="hints"]');
      if (el) { const orig = el.textContent; el.textContent = msg; setTimeout(() => { el.textContent = t('hints'); }, 2000); }
    }

    function getNodeRadius(n) {
      const kind = normalizeKind(n.kind || n);
      const size = n.size || scaledNodeSize(kind);
      const shape = nodeShapeKey(n);
      if (shape === 'ellipse' || shape === 'box' || shape === 'boxRounded') {
        const { width, height } = nodeShapeDimensions(size);
        return Math.max(width, height) / 2;
      }
      return size;
    }

    function hasOverlap(pos, kind, margin = 16, excludeId = null) {
      const rNew = getNodeRadius({ kind, size: scaledNodeSize(kind) });
      const positions = network.getPositions();
      for (const n of nodes.get()) {
        if (n.id === excludeId) continue;
        const p = positions[n.id];
        if (!p) continue;
        if (Math.hypot(p.x - pos.x, p.y - pos.y) < rNew + getNodeRadius(n) + margin) return true;
      }
      return false;
    }

    function distPointToSegment(p, a, b) {
      const dx = b.x - a.x;
      const dy = b.y - a.y;
      const len2 = dx * dx + dy * dy;
      if (len2 < 1e-9) return Math.hypot(p.x - a.x, p.y - a.y);
      let t = ((p.x - a.x) * dx + (p.y - a.y) * dy) / len2;
      t = Math.max(0, Math.min(1, t));
      return Math.hypot(p.x - (a.x + t * dx), p.y - (a.y + t * dy));
    }

    function segmentsCross(a, b, c, d, eps = 0.03) {
      const denom = (b.x - a.x) * (d.y - c.y) - (b.y - a.y) * (d.x - c.x);
      if (Math.abs(denom) < 1e-9) return false;
      const t = ((c.x - a.x) * (d.y - c.y) - (c.y - a.y) * (d.x - c.x)) / denom;
      const u = ((c.x - a.x) * (b.y - a.y) - (c.y - a.y) * (b.x - a.x)) / denom;
      return t > eps && t < 1 - eps && u > eps && u < 1 - eps;
    }

    function segmentPassesThroughNode(a, b, nodeId, margin = 10) {
      const positions = network.getPositions();
      for (const n of nodes.get()) {
        if (n.id === nodeId) continue;
        const p = positions[n.id];
        if (!p) continue;
        const r = getNodeRadius(n) + margin;
        if (distPointToSegment(p, a, b) < r) return true;
      }
      return false;
    }

    function isLayoutPositionValid(pos, kind, anchorId = null, movingId = null) {
      if (hasOverlap(pos, kind, 16, movingId)) return false;
      if (!anchorId) return true;
      const positions = network.getPositions();
      const fromPos = positions[anchorId];
      if (!fromPos) return true;
      const skip = new Set([movingId].filter(Boolean));
      for (const e of edges.get()) {
        if (movingId && (e.from === movingId || e.to === movingId)) continue;
        const c = positions[e.from];
        const d = positions[e.to];
        if (!c || !d) continue;
        if (segmentsCross(fromPos, pos, c, d)) return false;
      }
      for (const n of nodes.get()) {
        if (n.id === anchorId || n.id === movingId || skip.has(n.id)) continue;
        const p = positions[n.id];
        if (!p) continue;
        if (distPointToSegment(p, fromPos, pos) < getNodeRadius(n) + 10) return false;
      }
      return true;
    }

    function searchLayoutPosition(preferred, kind, anchorId = null, movingId = null) {
      const positions = network.getPositions();
      const anchorPos = anchorId ? (positions[anchorId] || preferred) : preferred;
      const childR = getNodeRadius({ kind, size: scaledNodeSize(kind) });
      const baseAngle = Math.atan2(preferred.y - anchorPos.y, preferred.x - anchorPos.x);
      const minFromAnchor = anchorId ? minDistFromNode(anchorId, kind) : 0;
      const extra = kind === 'chain' ? 40 : kind === 'indirect' ? 50 : 35;

      for (let ring = 0; ring < 16; ring++) {
        for (let i = 0; i < 24; i++) {
          const spread = (i / 24) * Math.PI * 2 - Math.PI;
          const d = minFromAnchor + extra + ring * (childR * 2.1 + 22);
          const pos = {
            x: anchorPos.x + Math.cos(baseAngle + spread) * d,
            y: anchorPos.y + Math.sin(baseAngle + spread) * d,
          };
          const candidate = anchorId ? enforceClearOf(anchorId, pos, kind) : pos;
          if (isLayoutPositionValid(candidate, kind, anchorId, movingId)) return candidate;
        }
      }
      for (let ring = 0; ring < 12; ring++) {
        for (let i = 0; i < 16; i++) {
          const spread = (i - 8) * 0.42;
          const d = minFromAnchor + extra + ring * (childR * 2.4 + 28);
          const pos = {
            x: anchorPos.x + Math.cos(baseAngle + spread) * d,
            y: anchorPos.y + Math.sin(baseAngle + spread) * d,
          };
          const candidate = anchorId ? enforceClearOf(anchorId, pos, kind) : pos;
          if (!hasOverlap(candidate, kind, 16, movingId)) return candidate;
        }
      }
      return anchorId ? enforceClearOf(anchorId, preferred, kind) : preferred;
    }

    function minDistFromNode(nodeId, childKind) {
      const parent = nodes.get(nodeId);
      if (!parent) return 50;
      return getNodeRadius(parent) + getNodeRadius({ kind: childKind, size: scaledNodeSize(childKind) }) + 40;
    }

    function outwardAngle(fromId) {
      const positions = network.getPositions();
      const fromPos = positions[fromId] || { x: 0, y: 0 };
      const corePos = positions[CORE_ID] || { x: 0, y: 0 };
      const dx = fromPos.x - corePos.x;
      const dy = fromPos.y - corePos.y;
      const len = Math.hypot(dx, dy);
      if (len < 1) return Math.atan2(fromPos.y, fromPos.x || 1);
      return Math.atan2(dy, dx);
    }

    function enforceClearOf(anchorId, pos, childKind) {
      const positions = network.getPositions();
      const anchorPos = positions[anchorId];
      if (!anchorPos) return pos;
      const minD = minDistFromNode(anchorId, childKind);
      const dx = pos.x - anchorPos.x;
      const dy = pos.y - anchorPos.y;
      const d = Math.hypot(dx, dy);
      if (d >= minD) return pos;
      const angle = d < 1 ? outwardAngle(anchorId) : Math.atan2(dy, dx);
      return {
        x: anchorPos.x + Math.cos(angle) * minD,
        y: anchorPos.y + Math.sin(angle) * minD,
      };
    }

    function resolveFreePosition(preferred, kind, anchorId = null, movingId = null) {
      let pos = anchorId ? enforceClearOf(anchorId, preferred, kind) : preferred;
      if (isLayoutPositionValid(pos, kind, anchorId, movingId)) return pos;
      return searchLayoutPosition(preferred, kind, anchorId, movingId);
    }

    function layoutChildAtIndex(parentId, childKind, index, total, force = false) {
      const positions = network.getPositions();
      const parentPos = positions[parentId] || { x: 0, y: 0 };
      const baseAngle = outwardAngle(parentId);
      const spread = total <= 1 ? 0 : (index - (total - 1) / 2) * 0.72;
      const ring = Math.floor(index / 5);
      const extra = childKind === 'chain' ? 42 : childKind === 'indirect' ? 55 : 45;
      const dist = minDistFromNode(parentId, childKind) + extra + ring * 38;
      const preferred = {
        x: parentPos.x + Math.cos(baseAngle + spread) * dist,
        y: parentPos.y + Math.sin(baseAngle + spread) * dist,
      };
      if (force) {
        const enforced = enforceClearOf(parentId, preferred, childKind);
        return isLayoutPositionValid(enforced, childKind, parentId)
          ? enforced
          : searchLayoutPosition(preferred, childKind, parentId);
      }
      return resolveFreePosition(preferred, childKind, parentId);
    }

    function subtreeFanAngle(parentId, index, total) {
      const outward = outwardAngle(parentId);
      const rightward = outward - Math.PI / 2;
      if (total <= 1) return outward * 0.4 + rightward * 0.6;
      const arcSpan = Math.min(Math.PI * 0.92, 0.48 + total * 0.36);
      const spread = (index - (total - 1) / 2) * (arcSpan / (total - 1));
      return outward + spread;
    }

    function layoutSubtreeChildAtIndex(parentId, childKind, index, total, movingId = null) {
      const positions = network.getPositions();
      const parentPos = positions[parentId] || { x: 0, y: 0 };
      const angle = subtreeFanAngle(parentId, index, total);
      const extra = childKind === 'chain' ? 24 : childKind === 'indirect' ? 32 : 28;
      const dist = minDistFromNode(parentId, childKind) + extra;
      const preferred = {
        x: parentPos.x + Math.cos(angle) * dist,
        y: parentPos.y + Math.sin(angle) * dist,
      };
      return resolveFreePosition(preferred, childKind, parentId, movingId);
    }

    function placeChildNearParent(parentId, childKind) {
      const childIndex = edges.get().filter(e => e.from === parentId).length;
      return layoutChildAtIndex(parentId, childKind, childIndex, childIndex + 1);
    }

    function findParentOfKind(childId, parentKind) {
      const edge = edges.get().find(e => {
        if (e.to !== childId) return false;
        const from = nodes.get(e.from);
        return from && normalizeKind(from.kind) === parentKind;
      });
      return edge?.from || null;
    }

    function immediateChildIds(parentId) {
      const parent = nodes.get(parentId);
      if (!parent) return [];
      const parentLevel = kindLevel(parent.kind);
      if (parentLevel < 0) return [];
      const levels = new Map();
      edges.get().forEach(e => {
        const candidates = [];
        if (e.from === parentId) candidates.push(e.to);
        if (e.to === parentId) candidates.push(e.from);
        candidates.forEach(childId => {
          if (childId === parentId) return;
          const child = nodes.get(childId);
          if (!child) return;
          const level = kindLevel(child.kind);
          if (level <= parentLevel) return;
          if (!levels.has(childId) || level < levels.get(childId)) levels.set(childId, level);
        });
      });
      if (!levels.size) return [];
      const available = [...levels.values()];
      const preferred = parentLevel + 1;
      const targetLevel = available.includes(preferred) ? preferred : Math.min(...available);
      return [...levels.entries()]
        .filter(([, level]) => level === targetLevel)
        .map(([id]) => id);
    }

    function sortIdsByAngleAround(parentId, ids) {
      const positions = network.getPositions();
      const parentPos = positions[parentId] || { x: 0, y: 0 };
      return ids.slice().sort((a, b) => {
        const pa = positions[a] || parentPos;
        const pb = positions[b] || parentPos;
        const aa = Math.atan2(pa.y - parentPos.y, pa.x - parentPos.x);
        const ab = Math.atan2(pb.y - parentPos.y, pb.x - parentPos.x);
        return aa - ab || String(a).localeCompare(String(b));
      });
    }

    function collectDescendantIds(rootId) {
      const desc = new Set();
      const queue = immediateChildIds(rootId).filter(id => id !== rootId);
      while (queue.length) {
        const id = queue.shift();
        if (!id || desc.has(id) || id === rootId) continue;
        desc.add(id);
        immediateChildIds(id).forEach(cid => {
          if (cid !== rootId && !desc.has(cid)) queue.push(cid);
        });
      }
      return desc;
    }

    function snapshotNodePositions() {
      const snap = {};
      nodes.get().forEach(n => {
        const p = network.getPositions([n.id])[n.id];
        if (p) snap[n.id] = { x: p.x, y: p.y };
      });
      return snap;
    }

    function restoreNodePositions(snap, onlyIds) {
      onlyIds.forEach(id => {
        const p = snap[id];
        if (!p) return;
        network.moveNode(id, p.x, p.y);
      });
    }

    function relayoutImmediateChildren(rootId) {
      const childIds = sortIdsByAngleAround(rootId, immediateChildIds(rootId));
      if (!childIds.length) return false;
      const total = childIds.length;
      childIds.forEach((id, index) => {
        const n = nodes.get(id);
        if (!n) return;
        const kind = normalizeKind(n.kind);
        const pos = layoutSubtreeChildAtIndex(rootId, kind, index, total, id);
        commitNode(id, n._raw || '', kind, pos.x, pos.y);
      });
      return true;
    }

    function relayoutSubtree(rootId) {
      if (!network || !nodes || !rootId) return;
      const childIds = immediateChildIds(rootId);
      if (!childIds.length) {
        showStatus(t('relayoutSubtreeNone'));
        return;
      }

      const movable = new Set(childIds);
      const snap = snapshotNodePositions();
      const pinnedIds = nodes.get()
        .map(n => n.id)
        .filter(id => id === rootId || !movable.has(id));

      pushHistory();
      relayoutImmediateChildren(rootId);
      syncNodePositionsFromNetwork([...movable]);
      restoreNodePositions(snap, pinnedIds);
      network.redraw();
      saveState();
      showStatus(t('relayoutSubtreeDone'));
    }

    function layoutAllNodes() {
      if (!network || !nodes) return;
      const inputs = readInputs();
      const radius = getRadius();

      commitNode(CORE_ID, inputs.core, 'core', 0, 0);

      const directs = nodes.get().filter(n => normalizeKind(n.kind) === 'direct');
      const directCount = Math.max(directs.length, 1);
      directs.forEach((n, i) => {
        let text = n._raw || '';
        const fixedIdx = DIRECT_IDS.indexOf(n.id);
        if (fixedIdx >= 0) text = inputs.directs[fixedIdx];
        const angle = -Math.PI / 2 + (2 * Math.PI * i) / directCount;
        const preferred = { x: radius * Math.cos(angle), y: radius * Math.sin(angle) };
        const pos = resolveFreePosition(preferred, 'direct', CORE_ID);
        commitNode(n.id, text, 'direct', pos.x, pos.y);
      });

      const indirects = nodes.get().filter(n => normalizeKind(n.kind) === 'indirect');
      const indirectGroups = {};
      indirects.forEach(n => {
        const parentId = findParentOfKind(n.id, 'direct') || '_orphan';
        if (!indirectGroups[parentId]) indirectGroups[parentId] = [];
        indirectGroups[parentId].push(n);
      });
      Object.entries(indirectGroups).forEach(([parentId, group]) => {
        if (parentId === '_orphan') {
          group.forEach((n, i) => {
            const angle = -Math.PI / 2 + (2 * Math.PI * i) / group.length;
            const d = radius * 1.55;
            const pos = resolveFreePosition({ x: d * Math.cos(angle), y: d * Math.sin(angle) }, 'indirect');
            commitNode(n.id, n._raw, 'indirect', pos.x, pos.y);
          });
        } else {
          group.forEach((n, i) => {
            const pos = layoutChildAtIndex(parentId, 'indirect', i, group.length);
            commitNode(n.id, n._raw, 'indirect', pos.x, pos.y);
          });
        }
      });

      const chains = nodes.get().filter(n => normalizeKind(n.kind) === 'chain');
      const chainGroups = {};
      chains.forEach(n => {
        const parentId = findParentOfKind(n.id, 'indirect') || '_orphan';
        if (!chainGroups[parentId]) chainGroups[parentId] = [];
        chainGroups[parentId].push(n);
      });
      Object.entries(chainGroups).forEach(([parentId, group]) => {
        if (parentId === '_orphan') {
          group.forEach((n, i) => {
            const angle = (2 * Math.PI * i) / group.length;
            const d = radius * 2;
            const pos = resolveFreePosition({ x: d * Math.cos(angle), y: d * Math.sin(angle) }, 'chain');
            commitNode(n.id, n._raw, 'chain', pos.x, pos.y);
          });
        } else {
          group.forEach((n, i) => {
            const pos = layoutChildAtIndex(parentId, 'chain', i, group.length);
            commitNode(n.id, n._raw, 'chain', pos.x, pos.y);
          });
        }
      });

      applyNodeColors();
      ensureAllNodeSizes();
      network.fit({ animation: { duration: 400, easingFunction: 'easeInOutQuad' } });
    }

    function relayoutAllNodes() {
      if (!network || !nodes) return;
      if (!confirm(t('confirmReset'))) return;
      pushHistory();
      layoutAllNodes();
      saveState();
      showStatus(t('relayouted'));
    }

    function parseOutlineText(text) {
      const lines = String(text).split(/\r?\n/);
      const raw = [];
      let minIndent = Infinity;
      lines.forEach(line => {
        if (!line.trim()) return;
        const m = line.match(/^([\t ]*)(.*)$/);
        if (!m) return;
        const content = m[2].trim();
        if (!content) return;
        const indent = m[1].length;
        minIndent = Math.min(minIndent, indent);
        raw.push({ indent, text: content });
      });
      if (!raw.length) return null;
      const base = Number.isFinite(minIndent) ? minIndent : 0;
      return raw.map(row => ({
        level: Math.min(3, Math.max(0, row.indent - base)),
        text: row.text,
      }));
    }

    function importFromOutline(parsed) {
      if (!network || !nodes || !edges || !parsed?.length) return false;
      nodes.clear();
      edges.clear();
      nextId = 100;

      const stack = [];
      let hasCore = false;

      parsed.forEach(item => {
        let level = item.level;
        const text = item.text;

        if (!hasCore) {
          commitNode(CORE_ID, text, 'core', 0, 0);
          stack.length = 0;
          stack.push({ level: 0, id: CORE_ID });
          hasCore = true;
          return;
        }

        if (level === 0) level = 1;

        while (stack.length && stack[stack.length - 1].level >= level) {
          stack.pop();
        }

        let parentLevel = stack.length ? stack[stack.length - 1].level : 0;
        let parentId = stack.length ? stack[stack.length - 1].id : CORE_ID;
        if (level > parentLevel + 1) level = parentLevel + 1;

        const kind = LEVEL_KIND[level] || 'chain';
        const id = newNodeId(kind);
        commitNode(id, text, kind, 0, 0);
        connectNodes(parentId, id);
        stack.push({ level, id });
      });

      layoutAllNodes();
      return true;
    }

    function findDropTarget(draggedId) {
      const positions = network.getPositions();
      const dragged = nodes.get(draggedId);
      const draggedPos = positions[draggedId];
      if (!dragged || !draggedPos) return null;

      const draggedR = getNodeRadius(dragged);
      let targetId = null;
      let minDist = Infinity;

      nodes.get().forEach(n => {
        if (n.id === draggedId) return;
        const pos = positions[n.id];
        if (!pos) return;
        const dist = Math.hypot(pos.x - draggedPos.x, pos.y - draggedPos.y);
        const threshold = (draggedR + getNodeRadius(n)) * 0.95;
        if (dist <= threshold && dist < minDist) {
          minDist = dist;
          targetId = n.id;
        }
      });
      return targetId;
    }

    function connectNodes(from, to) {
      if (!from || !to || from === to) return false;
      const exists = edges.get().some(e =>
        (e.from === from && e.to === to) || (e.from === to && e.to === from)
      );
      if (exists) return false;
      const eid = `e-${from}-${to}-${Date.now()}`;
      const ep = newEdgeProps();
      edges.add({ id: eid, from, to, ...ep });
      return true;
    }

    function connectNodesByHierarchy(idA, idB) {
      const link = resolveHierarchyLink(idA, idB);
      if (!link) return false;
      return connectNodes(link.from, link.to);
    }

    function addSecondaryAt(x, y, label) {
      const text = label !== undefined ? label : prompt(t('promptNew'));
      if (text === null) return;
      pushHistory();
      const pos = resolveFreePosition({ x, y }, 'indirect');
      const id = commitNode(newNodeId('indirect'), text, 'indirect', pos.x, pos.y);
      saveState();
      return id;
    }

    function editNode(id) {
      const n = nodes.get(id);
      if (!n) return;
      const raw = n._raw || (n.label || '').replace(/\n/g, '');
      const text = prompt(t('promptEdit'), raw);
      if (text === null) return;
      pushHistory();
      updateNodeTextOnly(id, text);
      network.redraw();
      saveState();
    }

    function angleForNewDirect() {
      const positions = network.getPositions();
      const directs = nodes.get().filter(n => normalizeKind(n.kind) === 'direct');
      if (!directs.length) return -Math.PI / 2;
      const angles = directs.map(n => {
        const p = positions[n.id] || { x: 0, y: 0 };
        return Math.atan2(p.y, p.x);
      }).sort((a, b) => a - b);
      let bestGap = 0;
      let bestAngle = -Math.PI / 2;
      for (let i = 0; i < angles.length; i++) {
        const a1 = angles[i];
        const a2 = i < angles.length - 1 ? angles[i + 1] : angles[0] + 2 * Math.PI;
        const gap = a2 - a1;
        if (gap > bestGap) {
          bestGap = gap;
          bestAngle = a1 + gap / 2;
          if (bestAngle > Math.PI) bestAngle -= 2 * Math.PI;
        }
      }
      return bestAngle;
    }

    function addDirectImpact(coreId) {
      const text = prompt(t('promptDirect'));
      if (text === null || !text.trim()) return;
      pushHistory();
      const radius = getRadius();
      const angle = angleForNewDirect();
      const preferred = { x: radius * Math.cos(angle), y: radius * Math.sin(angle) };
      const pos = resolveFreePosition(preferred, 'direct', coreId);
      const id = commitNode(newNodeId('direct'), text.trim(), 'direct', pos.x, pos.y);
      connectNodes(coreId, id);
      saveState();
      showStatus(t('addedDirect'));
    }

    function addIndirectImpact(directId) {
      const text = prompt(t('promptIndirect'));
      if (text === null || !text.trim()) return;
      pushHistory();
      const pos = placeChildNearParent(directId, 'indirect');
      const id = commitNode(newNodeId('indirect'), text.trim(), 'indirect', pos.x, pos.y);
      connectNodes(directId, id);
      saveState();
      showStatus(t('addedIndirect'));
    }

    function addChainImpact(indirectId) {
      const text = prompt(t('promptChain'));
      if (text === null || !text.trim()) return;
      pushHistory();
      const pos = placeChildNearParent(indirectId, 'chain');
      const id = commitNode(newNodeId('chain'), text.trim(), 'chain', pos.x, pos.y);
      connectNodes(indirectId, id);
      saveState();
      showStatus(t('addedChain'));
    }

    function copyNode(id) {
      const n = nodes.get(id);
      if (!n || n.kind === 'core') return;
      pushHistory();
      const raw = n._raw || (n.label || '').replace(/\n/g, '');
      const pos = network.getPositions([id])[id] || { x: n.x || 0, y: n.y || 0 };
      const kind = normalizeKind(n.kind);
      const free = resolveFreePosition({ x: pos.x + 70, y: pos.y + 45 }, kind);
      commitNode(newNodeId(kind), raw, kind, free.x, free.y);
      saveState();
      showStatus(t('copied'));
    }

    function getSelectedDeletable() {
      const nodeIds = network.getSelectedNodes().filter(id => id !== CORE_ID);
      const edgeIds = network.getSelectedEdges();
      return { nodeIds, edgeIds, count: nodeIds.length + edgeIds.length };
    }

    function deleteSelectedItems(nodeIds, edgeIds) {
      if (!nodeIds.length && !edgeIds.length) return;
      pushHistory();
      nodeIds.forEach(id => {
        nodes.remove(id);
        edges.remove(edges.get({ filter: e => e.from === id || e.to === id }).map(e => e.id));
      });
      if (edgeIds.length) edges.remove(edgeIds);
      network.unselectAll();
      saveState();
    }

    function deleteSelected(needConfirm) {
      if (!network) return false;
      const { nodeIds, edgeIds, count } = getSelectedDeletable();
      if (count === 0) return false;
      if (needConfirm && !confirm(t('confirmDeleteSelected').replace('{n}', count))) return false;
      deleteSelectedItems(nodeIds, edgeIds);
      showStatus(t('deleted'));
      return true;
    }

    function getSavedSelection(saved) {
      return saved || ctxSavedSelection || {
        nodes: network.getSelectedNodes(),
        edges: network.getSelectedEdges(),
      };
    }

    function getContextDeleteTargets(saved) {
      if (!ctxTarget) return { nodeIds: [], edgeIds: [] };
      const sel = getSavedSelection(saved);
      if (ctxTarget.type === 'node') {
        const selected = sel.nodes.filter(id => id !== CORE_ID);
        if (selected.length > 1 && selected.includes(ctxTarget.id)) {
          return { nodeIds: selected, edgeIds: [] };
        }
        if (ctxTarget.id === CORE_ID) return { nodeIds: [], edgeIds: [] };
        return { nodeIds: [ctxTarget.id], edgeIds: [] };
      }
      const selE = sel.edges;
      if (selE.length > 1 && selE.includes(ctxTarget.id)) {
        return { nodeIds: [], edgeIds: selE };
      }
      return { nodeIds: [], edgeIds: [ctxTarget.id] };
    }

    function getContextEdgeTargets(target, saved) {
      if (!target || target.type !== 'edge') return [];
      const sel = getSavedSelection(saved);
      const selE = sel.edges;
      if (selE.length > 1 && selE.includes(target.id)) return selE;
      const selN = sel.nodes.filter(id => id !== CORE_ID);
      if (selN.length > 1) {
        return edges.get().filter(e => selN.includes(e.from) || selN.includes(e.to)).map(e => e.id);
      }
      return [target.id];
    }

    function getContextNodeTargets(target, saved) {
      if (!target || target.type !== 'node') return [];
      const sel = getSavedSelection(saved);
      const selected = sel.nodes;
      if (selected.length > 1 && selected.includes(target.id)) return selected;
      return [target.id];
    }

    function commonNodeShape(nodeIds) {
      if (!nodeIds?.length) return null;
      let common = null;
      for (const id of nodeIds) {
        const shape = nodeShapeKey(nodes.get(id));
        if (common == null) common = shape;
        else if (common !== shape) return null;
      }
      return common;
    }

    function setNodeShape(nodeIds, shapeKey) {
      if (!network || !nodeIds?.length || !NODE_SHAPE_KEYS.includes(shapeKey)) return;
      pushHistory();
      nodeIds.forEach(id => {
        const node = nodes.get(id);
        if (!node) return;
        const patch = nodeShapeVisProps(shapeKey, node);
        const update = { id, ...patch };
        if (shapeKey === 'circle') {
          nodes.update({ ...update, _nodeShape: false, widthConstraint: false, heightConstraint: false });
        } else {
          nodes.update({ ...update, _nodeShape: shapeKey });
        }
      });
      network.redraw();
      saveState();
      showStatus(t('nodeShapeUpdated'));
    }

    function deleteTarget(saved) {
      const { nodeIds, edgeIds } = getContextDeleteTargets(saved);
      if (!nodeIds.length && !edgeIds.length) return;
      deleteSelectedItems(nodeIds, edgeIds);
      showStatus(t('deleted'));
    }

    const EDGE_STYLES = {
      'edge-both':   { arrows: { to: ARROW_ON, from: ARROW_ON }, dashes: false },
      'edge-to':     { arrows: { to: ARROW_ON, from: ARROW_OFF }, dashes: false },
      'edge-from':   { arrows: { to: ARROW_OFF, from: ARROW_ON }, dashes: false },
      'edge-none':   { arrows: { to: ARROW_OFF, from: ARROW_OFF }, dashes: false },
      'edge-dashed': { arrows: { to: ARROW_OFF, from: ARROW_OFF }, dashes: [6, 4] },
    };

    function cloneArrow(a) {
      return { enabled: !!(a && a.enabled), scaleFactor: (a && a.scaleFactor) || 0.5 };
    }

    function loadDefaultEdgeStyle() {
      defaultEdgeStyle = JSON.parse(JSON.stringify(BUILTIN_EDGE_DEFAULT));
      try {
        const saved = JSON.parse(localStorage.getItem(EDGE_DEFAULT_KEY));
        if (saved && saved.arrows) {
          defaultEdgeStyle = {
            arrows: {
              to: cloneArrow(saved.arrows.to),
              from: cloneArrow(saved.arrows.from),
            },
            dashes: saved.dashes || false,
          };
        }
      } catch (_) {}
    }

    function saveDefaultEdgeStyle() {
      try { localStorage.setItem(EDGE_DEFAULT_KEY, JSON.stringify(defaultEdgeStyle)); } catch (_) {}
    }

    function newEdgeProps() {
      return {
        arrows: {
          to: cloneArrow(defaultEdgeStyle.arrows.to),
          from: cloneArrow(defaultEdgeStyle.arrows.from),
        },
        dashes: defaultEdgeStyle.dashes,
        width: edgeLineWidth(),
        color: edgeColorObj(),
      };
    }

    function edgeMatchesDefault(edge) {
      if (!edge) return false;
      return detectEdgeStyle(edge) === detectEdgeStyle({ arrows: defaultEdgeStyle.arrows, dashes: defaultEdgeStyle.dashes });
    }

    function setEdgeAsDefault(edgeId) {
      const edge = edges.get(edgeId);
      if (!edge) return;
      defaultEdgeStyle = {
        arrows: {
          to: cloneArrow(edge.arrows && edge.arrows.to),
          from: cloneArrow(edge.arrows && edge.arrows.from),
        },
        dashes: edge.dashes || false,
      };
      saveDefaultEdgeStyle();
      showStatus(t('defaultEdgeSaved'));
    }

    function detectEdgeStyle(edge) {
      const toOn = !!(edge.arrows && edge.arrows.to && edge.arrows.to.enabled);
      const fromOn = !!(edge.arrows && edge.arrows.from && edge.arrows.from.enabled);
      const dashed = !!edge.dashes;
      if (dashed) return 'edge-dashed';
      if (toOn && fromOn) return 'edge-both';
      if (toOn) return 'edge-to';
      if (fromOn) return 'edge-from';
      return 'edge-none';
    }

    function applyEdgeStyle(edgeIds, styleKey) {
      const ids = (Array.isArray(edgeIds) ? edgeIds : [edgeIds]).filter(Boolean);
      if (!ids.length) return;
      const style = EDGE_STYLES[styleKey];
      if (!style) return;
      pushHistory();
      ids.forEach(id => edges.update({ id, arrows: style.arrows, dashes: style.dashes }));
      saveState();
      showStatus(t('edgeStyleUpdated'));
    }

    /* ── context menu ── */
    const ctxMenu = document.getElementById('ctx-menu');
    function showCtxMenu(x, y, target) {
      ctxTarget = target;
      const maxX = window.innerWidth - 180;
      const maxY = window.innerHeight - 280;
      ctxMenu.style.left = Math.min(x, maxX) + 'px';
      ctxMenu.style.top = Math.min(y, maxY) + 'px';
      ctxMenu.classList.add('show');

      let activeEdgeStyle = null;
      if (target.type === 'edge') {
        const edge = edges.get(target.id);
        if (edge) activeEdgeStyle = detectEdgeStyle(edge);
      }

      let commonShape = null;
      if (target.type === 'node') {
        commonShape = commonNodeShape(getContextNodeTargets(target, ctxSavedSelection));
      }

      ctxMenu.querySelectorAll('[data-scope]').forEach(el => {
        const scope = el.dataset.scope;
        let show = false;
        if (scope === 'node' && target.type === 'node') {
          const kind = normalizeKind(nodes.get(target.id)?.kind || '');
          const allowed = (el.dataset.for || '').split(',');
          show = allowed.includes(kind);
        } else if (scope === 'edge' && target.type === 'edge') {
          show = true;
        }
        el.classList.toggle('hidden', !show);
        if (!el.dataset.action) return;
        const shapeAction = NODE_SHAPE_ACTION[el.dataset.action];
        const isActiveStyle = scope === 'edge' && el.dataset.action === activeEdgeStyle;
        const isDefaultStyle = scope === 'edge' && el.dataset.action === 'set-edge-default'
          && target.type === 'edge' && edgeMatchesDefault(edges.get(target.id));
        const isSkipTranslate = scope === 'node' && el.dataset.action === 'skip-translate'
          && target.type === 'node' && !!nodes.get(target.id)?._skipTranslate;
        const isNodeShape = scope === 'node' && shapeAction && commonShape === shapeAction;
        el.classList.toggle('active-style', isActiveStyle || isDefaultStyle || isSkipTranslate || isNodeShape);
      });

      const submenu = ctxMenu.querySelector('.ctx-submenu');
      if (submenu) {
        const menuRect = ctxMenu.getBoundingClientRect();
        submenu.classList.toggle('flip-left', menuRect.right + 160 > window.innerWidth);
      }
    }
    function hideCtxMenu() {
      ctxMenu.classList.remove('show');
      ctxTarget = null;
      ctxSavedSelection = null;
    }

    function snapshotSelection() {
      if (!network) return;
      ctxSavedSelection = {
        nodes: network.getSelectedNodes(),
        edges: network.getSelectedEdges(),
      };
    }

    function domPointFromEvent(e) {
      const rect = document.getElementById('network').getBoundingClientRect();
      return { x: e.clientX - rect.left, y: e.clientY - rect.top };
    }

    function handleContextMenu(e) {
      e.preventDefault();
      e.stopPropagation();
      const dom = domPointFromEvent(e);
      const nodeId = network.getNodeAt(dom);
      if (nodeId) {
        showCtxMenu(e.clientX, e.clientY, { type: 'node', id: nodeId });
        return;
      }
      const edgeId = network.getEdgeAt(dom);
      if (edgeId) showCtxMenu(e.clientX, e.clientY, { type: 'edge', id: edgeId });
      else hideCtxMenu();
    }

    function networkDomPoint(clientX, clientY) {
      const rect = document.getElementById('network').getBoundingClientRect();
      return { x: clientX - rect.left, y: clientY - rect.top };
    }

    function normalizeDomRect(a, b) {
      const left = Math.min(a.x, b.x);
      const top = Math.min(a.y, b.y);
      return { left, top, width: Math.abs(b.x - a.x), height: Math.abs(b.y - a.y) };
    }

    function updateMarqueeBox() {
      const box = document.getElementById('selection-box');
      if (!marquee) {
        box.style.display = 'none';
        return;
      }
      const r = normalizeDomRect(marquee.start, marquee.current);
      box.style.display = 'block';
      box.style.left = r.left + 'px';
      box.style.top = r.top + 'px';
      box.style.width = r.width + 'px';
      box.style.height = r.height + 'px';
    }

    function nodesInDomRect(rect) {
      if (rect.width < 2 && rect.height < 2) return [];
      const tl = network.DOMtoCanvas({ x: rect.left, y: rect.top });
      const br = network.DOMtoCanvas({ x: rect.left + rect.width, y: rect.top + rect.height });
      const minX = Math.min(tl.x, br.x);
      const maxX = Math.max(tl.x, br.x);
      const minY = Math.min(tl.y, br.y);
      const maxY = Math.max(tl.y, br.y);
      const positions = network.getPositions();
      return nodes.get().filter(n => {
        const p = positions[n.id];
        if (!p) return false;
        const r = getNodeRadius(n);
        return p.x - r >= minX && p.x + r <= maxX && p.y - r >= minY && p.y + r <= maxY;
      }).map(n => n.id);
    }

    function finishMarquee() {
      if (!marquee) return;
      const rect = normalizeDomRect(marquee.start, marquee.current);
      const picked = nodesInDomRect(rect);
      if (rect.width < 4 && rect.height < 4) {
        if (!marquee.additive) {
          pendingMarqueeSelection = null;
          network.unselectAll();
        }
      } else {
        suppressBlankClickUntil = Date.now() + 400;
        if (marquee.additive) {
          const merged = [...new Set([...network.getSelectedNodes(), ...picked])];
          pendingMarqueeSelection = merged;
          network.selectNodes(merged);
        } else {
          pendingMarqueeSelection = picked.slice();
          network.selectNodes(picked);
        }
        if (picked.length) showStatus(t('selected').replace('{n}', network.getSelectedNodes().length));
      }
      marquee = null;
      updateMarqueeBox();
    }

    function setupMarqueeSelection() {
      const bind = () => {
        const canvas = document.querySelector('#network canvas');
        if (!canvas || canvas.dataset.marqueeBound) return;
        canvas.dataset.marqueeBound = '1';

        canvas.addEventListener('mousedown', e => {
          if (connectMode || e.button !== 0 || canvasPanMode) return;
          const dom = networkDomPoint(e.clientX, e.clientY);
          if (network.getNodeAt(dom)) return;
          e.preventDefault();
          e.stopPropagation();
          marquee = { start: dom, current: dom, additive: e.ctrlKey || e.metaKey };
          if (!marquee.additive) {
            pendingMarqueeSelection = null;
            network.unselectAll();
          }
          updateMarqueeBox();
        });
      };

      bind();
      network.on('afterDrawing', bind);

      window.addEventListener('mousemove', e => {
        if (marquee) {
          marquee.current = networkDomPoint(e.clientX, e.clientY);
          updateMarqueeBox();
        }
        if (panning) {
          const dx = e.clientX - panning.x;
          const dy = e.clientY - panning.y;
          const s = panning.scale;
          network.moveTo({
            position: { x: panning.view.x - dx / s, y: panning.view.y - dy / s },
            scale: s,
            animation: false,
          });
        }
      });

      window.addEventListener('mouseup', e => {
        if (marquee && e.button === 0) {
          finishMarquee();
          e.preventDefault();
          e.stopPropagation();
        }
        if (panning && e.button === 1) panning = null;
      }, true);
    }

    function setupCanvasPan() {
      const bind = () => {
        const canvas = document.querySelector('#network canvas');
        if (!canvas || canvas.dataset.panBound) return;
        canvas.dataset.panBound = '1';
        canvas.addEventListener('mousedown', e => {
          if (e.button !== 1) return;
          e.preventDefault();
          panning = {
            x: e.clientX,
            y: e.clientY,
            view: network.getViewPosition(),
            scale: network.getScale(),
          };
        });
        canvas.addEventListener('auxclick', e => e.preventDefault());
      };
      bind();
      network.on('afterDrawing', bind);
    }

    function setupContextMenu() {
      const bindCanvasMenu = () => {
        const canvas = document.querySelector('#network canvas');
        if (!canvas || canvas.dataset.ctxBound) return;
        canvas.dataset.ctxBound = '1';
        canvas.addEventListener('mousedown', e => {
          if (e.button === 2) snapshotSelection();
        }, true);
        canvas.addEventListener('contextmenu', handleContextMenu);
      };
      bindCanvasMenu();
      network.on('afterDrawing', bindCanvasMenu);
      network.on('oncontext', params => {
        params.event.preventDefault();
        if (params.nodes.length > 0) {
          showCtxMenu(params.event.clientX, params.event.clientY, { type: 'node', id: params.nodes[0] });
        } else if (params.edges.length > 0) {
          showCtxMenu(params.event.clientX, params.event.clientY, { type: 'edge', id: params.edges[0] });
        }
      });
    }

    document.addEventListener('pointerdown', e => {
      if (!ctxMenu.contains(e.target)) hideCtxMenu();
      const alignWrap = document.querySelector('.align-dropdown');
      if (alignWrap && !alignWrap.contains(e.target)) hideAlignMenu();
      const swapWrap = document.querySelector('.swap-dropdown');
      if (swapWrap && !swapWrap.contains(e.target)) hideSwapMenu();
    });
    ctxMenu.addEventListener('pointerdown', e => e.stopPropagation());
    ctxMenu.addEventListener('click', e => {
      const btn = e.target.closest('[data-action]');
      if (!btn || !ctxTarget) return;
      e.stopPropagation();
      const action = btn.dataset.action;
      const target = { ...ctxTarget };
      const saved = ctxSavedSelection;
      hideCtxMenu();
      if (action === 'add-direct' && target.type === 'node') addDirectImpact(target.id);
      else if (action === 'enlarge-node' && target.type === 'node') resizeNodeFromMenu(target.id, SIZE_STEP);
      else if (action === 'shrink-node' && target.type === 'node') resizeNodeFromMenu(target.id, -SIZE_STEP);
      else if (action === 'skip-translate' && target.type === 'node') toggleSkipTranslate(target.id);
      else if (NODE_SHAPE_ACTION[action] && target.type === 'node') {
        setNodeShape(getContextNodeTargets(target, saved), NODE_SHAPE_ACTION[action]);
      }
      else if (action === 'add-indirect' && target.type === 'node') addIndirectImpact(target.id);
      else if (action === 'add-chain' && target.type === 'node') addChainImpact(target.id);
      else if (action === 'relayout-subtree' && target.type === 'node') relayoutSubtree(target.id);
      else if (action === 'copy-wheel-image' && target.type === 'node') copyWheelImageToClipboard();
      else if (action === 'copy-subtree-image' && target.type === 'node') copySubtreeImageToClipboard(target.id);
      else if (action === 'copy' && target.type === 'node') copyNode(target.id);
      else if (action === 'delete') { ctxTarget = target; deleteTarget(saved); }
      else if (action === 'set-edge-default' && target.type === 'edge') setEdgeAsDefault(target.id);
      else if (action.startsWith('edge-') && target.type === 'edge') applyEdgeStyle(getContextEdgeTargets(target, saved), action);
    });

    /* ── tool dropdowns ── */
    const alignMenu = document.getElementById('align-menu');
    const swapMenu = document.getElementById('swap-menu');

    function hideAlignMenu() {
      if (alignMenu) alignMenu.classList.remove('show');
    }

    function hideSwapMenu() {
      if (swapMenu) swapMenu.classList.remove('show');
    }

    function toggleAlignMenu() {
      if (!alignMenu) return;
      hideSwapMenu();
      alignMenu.classList.toggle('show');
    }

    function toggleSwapMenu() {
      if (!swapMenu) return;
      hideAlignMenu();
      swapMenu.classList.toggle('show');
    }

    function selectionBounds(ids) {
      const positions = network.getPositions(ids);
      let left = Infinity;
      let right = -Infinity;
      let top = Infinity;
      let bottom = -Infinity;
      ids.forEach(id => {
        const p = positions[id];
        const n = nodes.get(id);
        if (!p || !n) return;
        const r = getNodeRadius(n);
        left = Math.min(left, p.x - r);
        right = Math.max(right, p.x + r);
        top = Math.min(top, p.y - r);
        bottom = Math.max(bottom, p.y + r);
      });
      return {
        left,
        right,
        top,
        bottom,
        midX: (left + right) / 2,
        midY: (top + bottom) / 2,
      };
    }

    function getSwapSelection() {
      const ids = network.getSelectedNodes();
      if (ids.length > 3) {
        showStatus(t('swapTooMany'));
        return null;
      }
      if (ids.length !== 2) {
        showStatus(t('swapNeedTwo'));
        return null;
      }
      return ids;
    }

    function collectSubtreeIds(rootId, options = {}) {
      const { excludeChain = false } = options;
      const ids = [rootId];
      collectDescendantIds(rootId).forEach(id => {
        if (excludeChain && normalizeKind(nodes.get(id)?.kind) === 'chain') return;
        ids.push(id);
      });
      return ids;
    }

    function swapSelectedNodeContent() {
      if (!network || !nodes) return;
      const ids = getSwapSelection();
      if (!ids) return;
      const [idA, idB] = ids;
      const nodeA = nodes.get(idA);
      const nodeB = nodes.get(idB);
      if (!nodeA || !nodeB) return;
      const positions = network.getPositions([idA, idB]);
      const posA = positions[idA];
      const posB = positions[idB];
      if (!posA || !posB) return;
      const textA = nodeA._raw || '';
      const textB = nodeB._raw || '';
      pushHistory();
      commitNode(idA, textB, normalizeKind(nodeA.kind), posA.x, posA.y);
      commitNode(idB, textA, normalizeKind(nodeB.kind), posB.x, posB.y);
      network.selectNodes(ids);
      network.redraw();
      saveState();
      showStatus(t('swapDone'));
    }

    function getTransformSelection() {
      const ids = network.getSelectedNodes();
      if (!ids.length) {
        showStatus(t('transformNeedSelection'));
        return null;
      }
      return ids;
    }

    function transformSelectedNodes(mode) {
      if (!network || !nodes) return false;
      const ids = getTransformSelection();
      if (!ids) return false;
      const bounds = selectionBounds(ids);
      const cx = bounds.midX;
      const cy = bounds.midY;
      const positions = network.getPositions(ids);
      pushHistory();
      ids.forEach(id => {
        const p = positions[id];
        if (!p) return;
        const dx = p.x - cx;
        const dy = p.y - cy;
        let x = p.x;
        let y = p.y;
        switch (mode) {
          case 'rotate-right':
            x = cx + dy;
            y = cy - dx;
            break;
          case 'rotate-left':
            x = cx - dy;
            y = cy + dx;
            break;
          case 'flip-v':
            x = cx - dx;
            break;
          case 'flip-h':
            y = cy - dy;
            break;
          default:
            return;
        }
        network.moveNode(id, x, y);
        const n = nodes.get(id);
        nodes.update({ id, x, y, ...(n ? nodeSizePayload(n) : {}) });
      });
      network.selectNodes(ids);
      network.redraw();
      saveState();
      const doneKey = {
        'rotate-right': 'rotateRightDone',
        'rotate-left': 'rotateLeftDone',
        'flip-v': 'flipVerticalDone',
        'flip-h': 'flipHorizontalDone',
      }[mode];
      if (doneKey) showStatus(t(doneKey));
      return true;
    }

    function swapSelectedNodePositions() {
      if (!network || !nodes) return;
      const ids = getSwapSelection();
      if (!ids) return;
      const [idA, idB] = ids;
      const nodeA = nodes.get(idA);
      const nodeB = nodes.get(idB);
      if (!nodeA || !nodeB) return;
      const excludeChain = normalizeKind(nodeA.kind) === 'direct' && normalizeKind(nodeB.kind) === 'direct';
      const subtreeA = collectSubtreeIds(idA, { excludeChain });
      const subtreeB = collectSubtreeIds(idB, { excludeChain });
      const setB = new Set(subtreeB);
      if (subtreeA.some(id => setB.has(id))) {
        showStatus(t('swapOverlap'));
        return;
      }
      const allIds = [...new Set([...subtreeA, ...subtreeB])];
      const positions = network.getPositions(allIds);
      const posA = positions[idA];
      const posB = positions[idB];
      if (!posA || !posB) return;
      const dxAB = posB.x - posA.x;
      const dyAB = posB.y - posA.y;
      pushHistory();
      subtreeA.forEach(id => {
        const p = positions[id];
        if (!p) return;
        const x = p.x + dxAB;
        const y = p.y + dyAB;
        network.moveNode(id, x, y);
        const n = nodes.get(id);
        nodes.update({ id, x, y, ...(n ? nodeSizePayload(n) : {}) });
      });
      subtreeB.forEach(id => {
        const p = positions[id];
        if (!p) return;
        const x = p.x - dxAB;
        const y = p.y - dyAB;
        network.moveNode(id, x, y);
        const n = nodes.get(id);
        nodes.update({ id, x, y, ...(n ? nodeSizePayload(n) : {}) });
      });
      network.selectNodes(ids);
      network.redraw();
      saveState();
      showStatus(t('swapPositionDone'));
    }

    function alignSelectedNodes(mode) {
      if (!network || !nodes) return;
      const ids = network.getSelectedNodes();
      if (ids.length < 2) {
        showStatus(t('alignNeedTwo'));
        return;
      }
      const bounds = selectionBounds(ids);
      const positions = network.getPositions(ids);
      pushHistory();
      ids.forEach(id => {
        const p = positions[id];
        const n = nodes.get(id);
        if (!p || !n) return;
        const r = getNodeRadius(n);
        let x = p.x;
        let y = p.y;
        switch (mode) {
          case 'left': x = bounds.left + r; break;
          case 'center-h': x = bounds.midX; break;
          case 'right': x = bounds.right - r; break;
          case 'top': y = bounds.top + r; break;
          case 'center-v': y = bounds.midY; break;
          case 'bottom': y = bounds.bottom - r; break;
          default: return;
        }
        network.moveNode(id, x, y);
        nodes.update({ id, x, y, ...nodeSizePayload(n) });
      });
      saveState();
      showStatus(t('alignDone'));
    }

    /* ── undo / redo ── */
    function updateUndoRedoButtons() {
      const undoBtn = document.getElementById('btn-undo');

      if (redoBtn) redoBtn.disabled = redoStack.length === 0;

    function pushHistory() {
      if (historyPaused || !network || !nodes) return;
      const snap = JSON.stringify(serialize());
      if (undoStack.length && undoStack[undoStack.length - 1] === snap) return;
      undoStack.push(snap);
      if (undoStack.length > HISTORY_MAX) undoStack.shift();
      redoStack = [];
      updateUndoRedoButtons();
    }

    function undo() {
      if (!undoStack.length || !network) return;
      redoStack.push(JSON.stringify(serialize()));
      if (redoStack.length > HISTORY_MAX) redoStack.shift();
      const data = JSON.parse(undoStack.pop());
      restore(data);
      applyNodeColors();
      applyStrokeStyles();
      saveState();
      updateUndoRedoButtons();
      showStatus(t('undone'));
    }

    function redo() {
      if (!redoStack.length || !network) return;
      undoStack.push(JSON.stringify(serialize()));
      if (undoStack.length > HISTORY_MAX) undoStack.shift();
      const data = JSON.parse(redoStack.pop());
      restore(data);
      applyNodeColors();
      applyStrokeStyles();
      saveState();
      updateUndoRedoButtons();
      showStatus(t('redone'));

    /* ── persistence ── */
    function hydrateFromLocalStorage() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (!saved) return false;
        const data = JSON.parse(saved);
        if (!data?.nodes?.length) return false;
        localSavedAt = data.savedAt || 0;
        restore(data);
        addDemoTemplateNodes();
        return true;
      } catch (_) {
        return false;
      }
    }

    function serialize() {
      const positions = network.getPositions();
      const savedAt = Date.now();
      localSavedAt = savedAt;
      return {
        version: 1,
        savedAt,
        inputs: readInputs(),
        nextId,
        nodes: nodes.get().map(n => ({
          id: n.id, _raw: n._raw || '', kind: normalizeKind(n.kind),
          x: positions[n.id]?.x ?? n.x, y: positions[n.id]?.y ?? n.y,
          _sizeFactor: nodeSizeFactor(n),
          ...(n._fontSize != null ? { _fontSize: n._fontSize } : {}),
          ...(n._fontBold != null ? { _fontBold: n._fontBold } : {}),
          ...(n._fontItalic != null ? { _fontItalic: n._fontItalic } : {}),
          ...(n._skipTranslate ? { _skipTranslate: true } : {}),
          ...(nodeShapeKey(n) !== 'circle' ? { _nodeShape: nodeShapeKey(n) } : {}),
        })),
        edges: edges.get().map(e => ({
          id: e.id, from: e.from, to: e.to,
          arrows: e.arrows,
          dashes: e.dashes ?? false,
        })),
      };
    }

    function restore(data) {
      if (!data) return false;
      historyPaused = true;
      try {
        nextId = data.nextId || 100;
        nodes.clear();
        edges.clear();
        data.nodes.forEach(n => {
          commitNode(n.id, n._raw, normalizeKind(n.kind), n.x, n.y, {
            sizeFactor: n._sizeFactor,
            fontSize: n._fontSize,
            fontBold: n._fontBold,
            fontItalic: n._fontItalic,
            skipTranslate: n._skipTranslate,
            nodeShape: n._nodeShape,
          });
        });
        edges.add(data.edges);
        if (network) {
          data.nodes.forEach(n => network.moveNode(n.id, n.x, n.y));
          network.redraw();
          network.fit({ animation: false });
        }
        return true;
      } finally {
        historyPaused = false;
      }
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(serialize()));
      } catch (_) {}
      updateNodeCountDisplay();
      scheduleCollabPush();
    }

    /* ── import / export ── */
    function nodePositionsMap() {
      if (network) return network.getPositions();
      const map = {};
      nodes.get().forEach(n => { map[n.id] = { x: n.x ?? 0, y: n.y ?? 0 }; });
      return map;
    }

    function sortChildIds(ids, parentId, positions) {
      const parentPos = positions[parentId] || { x: 0, y: 0 };
      return ids
        .map(id => ({ id, pos: positions[id] || { x: 0, y: 0 } }))
        .sort((a, b) => {
          const angleA = Math.atan2(a.pos.y - parentPos.y, a.pos.x - parentPos.x);
          const angleB = Math.atan2(b.pos.y - parentPos.y, b.pos.x - parentPos.x);
          return angleA - angleB || a.id.localeCompare(b.id);
        })
        .map(row => row.id);
    }

    function serializeOutlineText() {
      const core = nodes.get(CORE_ID) || nodes.get().find(n => normalizeKind(n.kind) === 'core');
      if (!core) return '';
      const positions = nodePositionsMap();
      const lines = [];
      const visited = new Set();

      function walk(nodeId, depth) {
        if (!nodeId || visited.has(nodeId)) return;
        visited.add(nodeId);
        const node = nodes.get(nodeId);
        if (!node) return;
        const level = Math.min(3, Math.max(0, depth));
        const text = String(node._raw || '').replace(/\r?\n/g, ' ').trim();
        if (!text) return;
        lines.push('\t'.repeat(level) + text);
        sortChildIds(immediateChildIds(nodeId), nodeId, positions).forEach(id => walk(id, depth + 1));
      }

      walk(core.id, 0);
      nodes.get().forEach(n => {
        if (visited.has(n.id)) return;
        const level = kindLevel(n.kind);
        if (level < 0) return;
        const text = String(n._raw || '').replace(/\r?\n/g, ' ').trim();
        if (!text) return;
        lines.push('\t'.repeat(level) + text);
      });
      return lines.join('\n') + (lines.length ? '\n' : '');
    }

    function downloadBlob(blob, filename) {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = filename;
      a.click();
      URL.revokeObjectURL(a.href);
    }

    async function exportData() {
      if (window.showSaveFilePicker) {
        try {
          const handle = await window.showSaveFilePicker({
            suggestedName: 'futures-wheel.json',
            types: [
              { description: 'JSON', accept: { 'application/json': ['.json'] } },
              { description: 'Text', accept: { 'text/plain': ['.txt'] } },
            ],
          });
          const isTxt = handle.name.toLowerCase().endsWith('.txt');
          const content = isTxt ? serializeOutlineText() : JSON.stringify(serialize(), null, 2);
          const blob = new Blob([content], {
            type: isTxt ? 'text/plain;charset=utf-8' : 'application/json',
          });
          const writable = await handle.createWritable();
          await writable.write(blob);
          await writable.close();
          showStatus(t(isTxt ? 'exportTxtDone' : 'exportJsonDone'));
          return;
        } catch (err) {
          if (err && err.name === 'AbortError') return;
        }
      }
      downloadBlob(
        new Blob([JSON.stringify(serialize(), null, 2)], { type: 'application/json' }),
        'futures-wheel.json',
      );
      showStatus(t('exportJsonDone'));

    function tryParseJsonImport(text) {
      const trimmed = String(text).trim();
      if (!trimmed.startsWith('{')) return null;
      try {
        const data = JSON.parse(trimmed);
        return data?.nodes?.length ? data : null;
      } catch (_) {

    function processImportText(text) {
      const parsed = parseOutlineText(text);
      if (!parsed?.length) {
        showStatus(t('importInvalid'));
        return false;
      }
      pushHistory();
      if (!importFromOutline(parsed)) {
        showStatus(t('importInvalid'));
        return false;
      }
      finishImport('importedTxt');
      return true;
    }

    function processImportFile(text, filename) {
      const preferJson = filename && /\.json$/i.test(filename);
      let data = preferJson ? tryParseJsonImport(text) : null;
      if (!data) data = tryParseJsonImport(text);
      if (data) {
        pushHistory();
        if (!restore(data)) {
          showStatus(t('importInvalid'));
          return false;
        }
        finishImport('importedJson');
        return true;
      }
      if (preferJson) {
        showStatus(t('importInvalid'));
        return false;
      }
      return processImportText(text);
    }

    function canvasToBlob(canvas, type, quality) {
      return new Promise(resolve => canvas.toBlob(resolve, type, quality));
    }

    function escapeXml(text) {
      return String(text)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&apos;');
    }

    function svgEdgeLine(edge, positions) {
      const from = nodes.get(edge.from);
      const to = nodes.get(edge.to);
      if (!from || !to) return '';
      const p1 = positions[edge.from];
      const p2 = positions[edge.to];
      if (!p1 || !p2) return '';
      const r1 = getNodeRadius(from);
      const r2 = getNodeRadius(to);
      const dx = p2.x - p1.x;
      const dy = p2.y - p1.y;
      const dist = Math.hypot(dx, dy) || 1;
      const ux = dx / dist;
      const uy = dy / dist;
      const toOn = !!(edge.arrows?.to?.enabled);
      const fromOn = !!(edge.arrows?.from?.enabled);
      const inset = 4;
      const x1 = p1.x + ux * (r1 + (fromOn ? inset : 0));
      const y1 = p1.y + uy * (r1 + (fromOn ? inset : 0));
      const x2 = p2.x - ux * (r2 + (toOn ? inset : 0));
      const y2 = p2.y - uy * (r2 + (toOn ? inset : 0));
      const ec = edge.color?.color || edgeColorObj().color;
      const width = edge.width || edgeLineWidth();
      const dash = edge.dashes ? ' stroke-dasharray="6 4"' : '';
      let markers = '';
      if (toOn && fromOn) markers = ' marker-start="url(#fw-arrow-start)" marker-end="url(#fw-arrow-end)"';
      else if (toOn) markers = ' marker-end="url(#fw-arrow-end)"';
      else if (fromOn) markers = ' marker-start="url(#fw-arrow-start)"';
      return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${escapeXml(ec)}" stroke-width="${width}" stroke-linecap="round"${dash}${markers}/>`;
    }

    function svgNodeLabel(node, anchorX, anchorY) {
      const raw = (node._raw || '').trim();
      const key = ANNO_KEY_BY_ID[node.id];
      let text = '';
      if (textOverlap) {
        text = internalNodeText(node);
      } else if (raw) {
        text = wrapLabel(raw);
      } else if (key) {
        text = t(key);
      }
      if (!text || !text.trim()) return '';
      const kind = normalizeKind(node.kind);
      const style = NODE_STYLE[kind] || NODE_STYLE.indirect;
      const fontSize = nodeFontSize(node);
      const bold = nodeFontBold(node);
      const italic = nodeFontItalic(node);
      const isAnnoOnly = !(node._raw || '').trim() && !!key;
      const fill = isAnnoOnly ? '#475569' : (style.font?.color || '#1e293b');
      const weight = (bold || isAnnoOnly) ? 'bold' : 'normal';
      const fontStyle = italic ? 'italic' : 'normal';
      const lines = String(text).split('\n');
      const lineHeight = fontSize + 2;
      const startY = anchorY - ((lines.length - 1) * lineHeight) / 2;
      const tspans = lines.map((line, i) =>
        `<tspan x="${anchorX}" y="${startY + i * lineHeight}" text-anchor="middle">${escapeXml(line)}</tspan>`
      ).join('');
      return `<text font-family="${FONT_FAMILY_CSS}" font-size="${fontSize}" font-weight="${weight}" font-style="${fontStyle}" fill="${escapeXml(fill)}">${tspans}</text>`;
    }

    function buildWheelSvg(filterIds = null) {
      if (!network || !nodes) return '';
      const nodeIdSet = new Set(filterIds || nodes.get().map(n => n.id));
      const positions = network.getPositions();
      const corePos = positions[CORE_ID] || { x: 0, y: 0 };
      let minX = Infinity;
      let minY = Infinity;
      let maxX = -Infinity;
      let maxY = -Infinity;
      nodeIdSet.forEach(id => {
        const n = nodes.get(id);
        const p = positions[id];
        if (!n || !p) return;
        const r = getNodeRadius(n);
        const labelPad = textOverlap ? r + 8 : r + 64;
        minX = Math.min(minX, p.x - labelPad);
        minY = Math.min(minY, p.y - labelPad);
        maxX = Math.max(maxX, p.x + labelPad);
        maxY = Math.max(maxY, p.y + labelPad);
      });
      if (!Number.isFinite(minX)) return '';
      const pad = 28;
      minX -= pad;
      minY -= pad;
      maxX += pad;
      maxY += pad;
      const width = Math.max(1, maxX - minX);
      const height = Math.max(1, maxY - minY);
      const edgeColor = edgeColorObj().color;
      const edgeSvg = edges.get()
        .filter(e => nodeIdSet.has(e.from) && nodeIdSet.has(e.to))
        .map(e => {
          const line = svgEdgeLine(e, positions);
          return line ? `<g data-edge-id="${escapeXml(e.id)}">${line}</g>` : '';
        })
        .join('');
      const nodeSvg = [...nodeIdSet].map(id => {
        const n = nodes.get(id);
        const p = positions[id];
        if (!n || !p) return '';
        const kind = normalizeKind(n.kind);
        const colors = nodeColorObj(kind);
        const r = getNodeRadius(n);
        const bw = circleBorderWidth();
        let textX = p.x;
        let textY = p.y;
        if (!textOverlap) {
          const raw = (n._raw || '').trim();
          const key = ANNO_KEY_BY_ID[n.id];
          if (raw || key) {
            const off = outwardOffset(id, p, corePos, r);
            textX = off.x;
            textY = off.y;
          }
        }
        const shape = nodeShapeKey(n);
        const size = n.size || scaledNodeSize(kind);
        const dims = nodeShapeDimensions(size);
        const w = dims.width;
        const h = dims.height;
        let shapeSvg;
        if (shape === 'ellipse') {
          shapeSvg = `<ellipse cx="${p.x}" cy="${p.y}" rx="${w / 2}" ry="${h / 2}" fill="${escapeXml(colors.background)}" stroke="${escapeXml(colors.border)}" stroke-width="${bw}"/>`;
        } else if (shape === 'box' || shape === 'boxRounded') {
          const br = shape === 'boxRounded' ? Math.max(4, Math.round(size * 0.35)) : 0;
          shapeSvg = `<rect x="${p.x - w / 2}" y="${p.y - h / 2}" width="${w}" height="${h}" rx="${br}" ry="${br}" fill="${escapeXml(colors.background)}" stroke="${escapeXml(colors.border)}" stroke-width="${bw}"/>`;
        } else {
          shapeSvg = `<circle cx="${p.x}" cy="${p.y}" r="${r}" fill="${escapeXml(colors.background)}" stroke="${escapeXml(colors.border)}" stroke-width="${bw}"/>`;
        }
        const label = svgNodeLabel(n, textX, textY);
        return `<g data-node-id="${escapeXml(id)}">${shapeSvg}${label}</g>`;
      }).join('');
      return `<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="${width}" height="${height}" viewBox="${minX} ${minY} ${width} ${height}">
  <defs>
    <marker id="fw-arrow-end" viewBox="0 0 10 8" markerWidth="8" markerHeight="6" refX="8" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="${escapeXml(edgeColor)}"/>
    </marker>
    <marker id="fw-arrow-start" viewBox="0 0 10 8" markerWidth="8" markerHeight="6" refX="2" refY="4" orient="auto">
      <path d="M10,0 L0,4 L10,8 z" fill="${escapeXml(edgeColor)}"/>
    </marker>
  </defs>
  <rect x="${minX}" y="${minY}" width="${width}" height="${height}" fill="#f8fafc"/>
  <g data-layer="edges">${edgeSvg}</g>
  <g data-layer="nodes">${nodeSvg}</g>
</svg>`;
    }

    async function waitForCanvasPaint() {
      if (network) network.redraw();
      await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
    }

    async function buildWheelImageBlob(scale = 2) {
      const source = document.querySelector('#network canvas');
      if (!source) return null;
      await waitForCanvasPaint();
      const out = document.createElement('canvas');
      out.width = Math.max(1, Math.round(source.width * scale));
      out.height = Math.max(1, Math.round(source.height * scale));
      const ctx = out.getContext('2d');
      ctx.fillStyle = '#f8fafc';
      ctx.fillRect(0, 0, out.width, out.height);
      ctx.imageSmoothingEnabled = true;
      ctx.imageSmoothingQuality = 'high';
      ctx.drawImage(source, 0, 0, out.width, out.height);
      return canvasToBlob(out, 'image/png');
    }

    async function writeImageBlobToClipboard(blob, doneKey, filename = 'futures-wheel.png') {
      if (!blob) {
        showStatus(t('copyWheelFailed'));
        return false;
      }
      try {
        if (navigator.clipboard?.write && window.ClipboardItem) {
          await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
          showStatus(t(doneKey));
          return true;
        }
        throw new Error('clipboard-unavailable');
      } catch (_) {
        try {
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = filename;
          a.click();
          URL.revokeObjectURL(url);
          showStatus(t('copyWheelFailed'));
        } catch (__) {
          showStatus(t('copyWheelFailed'));
        }
        return false;
      }
    }

    async function writeWheelVectorToClipboard(svgString, doneKey, pngFallback) {
      if (!svgString) {
        showStatus(t('copyWheelFailed'));
        return false;
      }
      const svgBlob = new Blob([svgString], { type: 'image/svg+xml;charset=utf-8' });
      const html = `<!DOCTYPE html><html><body><!--StartFragment-->${svgString}<!--EndFragment--></body></html>`;
      const htmlBlob = new Blob([html], { type: 'text/html' });
      const plainBlob = new Blob([svgString], { type: 'text/plain' });
      const attempts = [
        () => new ClipboardItem({ 'image/svg+xml': svgBlob, 'text/html': htmlBlob }),
        () => new ClipboardItem({ 'image/svg+xml': svgBlob }),
        () => new ClipboardItem({ 'text/html': htmlBlob, 'text/plain': plainBlob }),
      ];
      if (navigator.clipboard?.write && window.ClipboardItem) {
        for (const build of attempts) {
          try {
            await navigator.clipboard.write([build()]);
            showStatus(t(doneKey));
            return true;
          } catch (_) {}
        }
      }
      if (pngFallback) {
        const blob = await pngFallback();
        return writeImageBlobToClipboard(blob, doneKey);
      }
      try {
        const url = URL.createObjectURL(svgBlob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'futures-wheel.svg';
        a.click();
        URL.revokeObjectURL(url);
        showStatus(t(doneKey));
        return true;
      } catch (_) {
        showStatus(t('copyWheelFailed'));
        return false;
      }
    }

    async function copyWheelImageToClipboard() {
      if (!network || !nodes) return;
      await waitForCanvasPaint();
      const svg = buildWheelSvg();
      await writeWheelVectorToClipboard(svg, 'copyWheelDone', () => buildWheelImageBlob(2));
    }

    async function copySubtreeImageToClipboard(rootId) {
      if (!network || !nodes || !rootId) return;
      const ids = collectSubtreeIds(rootId);
      const savedView = {
        position: network.getViewPosition(),
        scale: network.getScale(),
      };
      try {
        network.fit({ nodes: ids, animation: false });
        await waitForCanvasPaint();
        const svg = buildWheelSvg(ids);
        await writeWheelVectorToClipboard(svg, 'copySubtreeDone', () => buildWheelImageBlob(2));
      } finally {
        network.moveTo({
          position: savedView.position,
          scale: savedView.scale,
          animation: false,
        });
        network.redraw();
      }
    }

    async function exportImage() {
      const canvas = document.querySelector('#network canvas');
      if (!canvas) return;

      if (window.showSaveFilePicker) {
        try {
          const handle = await window.showSaveFilePicker({
            suggestedName: 'futures-wheel.png',
            types: [
              { description: 'PNG', accept: { 'image/png': ['.png'] } },
              { description: 'JPEG', accept: { 'image/jpeg': ['.jpg', '.jpeg'] } },
            ],
          });
          const name = handle.name.toLowerCase();
          const useJpeg = name.endsWith('.jpg') || name.endsWith('.jpeg');
          const blob = await canvasToBlob(canvas, useJpeg ? 'image/jpeg' : 'image/png', useJpeg ? 0.92 : undefined);
          const writable = await handle.createWritable();
          await writable.write(blob);
          await writable.close();
          showStatus(t('exportImageDone'));
          return;
        } catch (err) {
          if (err && err.name === 'AbortError') return;
        }
      }

      const a = document.createElement('a');
      a.href = canvas.toDataURL('image/png');
      a.download = 'futures-wheel.png';
      a.click();
      showStatus(t('exportImageDone'));
    }

    /* ── events ── */
    document.getElementById('btn-reset').addEventListener('click', () => relayoutAllNodes());

    document.getElementById('btn-display-mode').addEventListener('click', () => setColorMode(!colorMode));
    document.getElementById('btn-undo').addEventListener('click', () => undo());
    document.getElementById('btn-redo').addEventListener('click', () => redo());

    document.addEventListener('keydown', e => {
      if (handleZoomOrResizeKey(e)) return;
    }, true);

    window.addEventListener('keydown', e => {
      const tag = document.activeElement?.tagName;
      const inField = tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT';
      if ((e.ctrlKey || e.metaKey) && !e.repeat && !inField) {
        const key = e.key.toLowerCase();
        if (key === 'b') {
          e.preventDefault();
          toggleSelectedFontBold();
          return;
        }
        if (key === 'i') {
          e.preventDefault();
          toggleSelectedFontItalic();
          return;
        }
        if (e.key === 'z' && !e.shiftKey) {
          e.preventDefault();
          undo();
          return;
        }
        if (e.key === 'y' || (e.key === 'z' && e.shiftKey)) {
          e.preventDefault();
          redo();
          return;
        }
      }
      if (!e.repeat && !inField && !e.ctrlKey && !e.metaKey && !e.altKey && network) {
        const key = e.key.toLowerCase();
        if (key === 'r' && transformSelectedNodes('rotate-right')) {
          e.preventDefault();
          return;
        }
        if (key === 'l' && transformSelectedNodes('rotate-left')) {
          e.preventDefault();
          return;
        }
        if (key === 'v' && transformSelectedNodes('flip-v')) {
          e.preventDefault();
          return;
        }
        if (key === 'h' && transformSelectedNodes('flip-h')) {
          e.preventDefault();
          return;
        }
      }
      if (e.key !== 'Delete' || e.repeat) return;
      if (inField) return;
      if (!network) return;
      const { count } = getSelectedDeletable();
      if (count === 0) return;
      e.preventDefault();
      deleteSelected(true);
    });

    document.getElementById('btn-import-data').addEventListener('click', importData);
    document.getElementById('btn-export-data').addEventListener('click', exportData);
    document.getElementById('btn-new-wheel').addEventListener('click', newFutureWheel);
    document.getElementById('import-file').addEventListener('change', handleImportFile);
    document.getElementById('btn-export-image').addEventListener('click', exportImage);

    document.getElementById('lang-select').addEventListener('change', e => {
      lang = e.target.value;
      localStorage.setItem('fw-lang', lang);
      applyI18n();
      updateDisplayModeButton();
      updateCollabStatus();
      if (network) network.redraw();
    });

    window.addEventListener('resize', () => {
      if (!network) return;
      network.redraw();
    });

    function showLoadError(msg) {
      const el = document.getElementById('load-error');
      el.textContent = msg;
      el.classList.add('show');
    }

    async function boot() {
      if (typeof vis === 'undefined') {
        showLoadError('無法載入 vis-network。請確認 vendor/vis-network.min.js 與 index.html 在同一資料夾內。');
        return;
      }
      roomId = ensureRoomInUrl();
      updateRoomUI();
      loadNodeColors();
      loadStrokeWidths();
      loadStrokeColors();
      loadTextOverlap();
      loadDisplayMode();
      loadDefaultEdgeStyle();
      syncColorInputs();
      syncStrokeInputs();
      syncTextOverlapInput();
      updateColorControlsState();
      setupColorPickers();
      setupStrokeInputs();
      setupStrokeColorPickers();
      setupTextOverlapControl();
      setupTranslateControl();
      setupCanvasPanControl();
      setupSwapControl();
      setupAlignControl();
      setupNumericInputFocus();
      setupCollabUI();
      nodes = new vis.DataSet([]);
      edges = new vis.DataSet([]);
      applyI18n();
      updateDisplayModeButton();
      syncTranslateLangDefaults();
      initNetwork();
      bootHydratedFromLocal = hydrateFromLocalStorage();
      await initCollaboration();
      if (collabEnabled) {
        lastSeenRev = yWheel.get('rev') || 0;
        lastSeenSettingsRev = yWheel.get('settingsRev') || 0;
        if (!bootHydratedFromLocal) {
          const settingsStr = yWheel.get('settings');
          if (settingsStr) {
            try { applyRemoteSettings(JSON.parse(settingsStr), true); } catch (_) {}
          }
          const snap = yWheel.get('snapshot');
          if (snap) {
            applyCollabSnapshot(snap, settingsStr);
          } else if (!nodes.get().length) {
            buildFullExample();
            pushCollabSnapshot();
          }
        }
        applyNodeColors();
        applyStrokeStyles();
        if (!bootHydratedFromLocal) saveState();
        else updateNodeCountDisplay();
        updateUndoRedoButtons();
        return;
      }
      if (!bootHydratedFromLocal) buildFullExample();
      applyNodeColors();
      applyStrokeStyles();
      saveState();
      updateUndoRedoButtons();
    }

    boot().catch(err => console.error('Boot failed:', err));
  </script>
</body>
</html>
